<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorthand to Schematic V5</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1b2430; --muted:#66707d; --line:#d9dee5; --accent:#2457c5; --err:#b3261e; --warn:#8a5a00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; margin-right:auto; }
  button { font:inherit; font-size:13px; padding:6px 12px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; color:var(--ink); }
  button:hover { border-color:var(--accent); color:var(--accent); }
  /* --leftw is the script panel width; dragging the divider sets it in pixels. The middle column is the divider. */
  main { flex:1; display:grid; grid-template-columns: var(--leftw, max(140px, 19%)) 12px 1fr; min-height:0; }
  #divider { position:relative; background:var(--line); cursor:col-resize; touch-action:none; user-select:none; }
  #divider:hover, #divider.drag { background:var(--accent); }
  #togglePanel { position:absolute; top:8px; left:0; width:12px; height:34px; padding:0; border:0; border-radius:0 6px 6px 0; background:var(--panel); color:var(--ink); font-size:14px; line-height:34px; cursor:pointer; box-shadow:0 0 0 1px var(--line); }
  #togglePanel:hover { color:var(--accent); }
  #rightPanel { user-select:none; cursor:grab; } #rightPanel.panning { cursor:grabbing; } #rightPanel .blk { cursor:pointer; }
  /* Collapsed: the column shrinks to nothing and the left panel is hidden (not removed) so its text and undo history stay. */
  main.collapsed { grid-template-columns: 0 12px 1fr; }
  main.collapsed .left { visibility:hidden; overflow:hidden; }
  main.collapsed #divider { cursor:default; }
  .left { display:flex; flex-direction:column; background:var(--panel); min-height:0; min-width:0; overflow:hidden; }
  /* Backdrop and textarea must share every font metric, or the highlighted lines drift off the text. */
  .ed { position:relative; flex:1; min-height:0; background:#fff; }
  #bd, #src { position:absolute; inset:0; margin:0; padding:14px; border:0; font:14px/21px ui-monospace, Consolas, Menlo, monospace; white-space:pre; tab-size:3; }
  #bd { overflow:hidden; pointer-events:none; color:transparent; }
  #bdIn { width:max-content; min-width:100%; }
  #bd .bl { margin:0 -14px; padding:0 14px; min-height:21px; }
  /* Bubble uses box-shadow instead of padding so the backdrop text keeps the textarea's exact character widths. */
  #bd .wb { background:rgba(229,56,59,.4); border-radius:8px; box-shadow:0 0 0 2px rgba(229,56,59,.4); }
  #bd .bl.strong { background:rgba(217,72,15,.24); }
  #bd .bl.weak { background:rgba(229,154,58,.20); }
  #src { width:100%; height:100%; resize:none; outline:none; background:transparent; color:var(--ink); overflow:auto; }
  #msgs { border-top:1px solid var(--line); padding:8px 14px; font-size:13px; max-height:130px; overflow:auto; }
  #msgs:empty { display:none; }
  .err { color:var(--err); } .warn { color:var(--warn); }
  code { background:#eef1f5; padding:1px 4px; border-radius:3px; font-size:12px; color:var(--ink); }
  .right { overflow:auto; padding:20px; min-height:0; }
  #out { background:#fff; border:1px solid var(--line); border-radius:8px; display:inline-block; min-width:100%; }
  #out svg { display:block; }
  .empty { padding:40px; color:var(--muted); }
  #zoomBar { position:sticky; top:0; z-index:2; display:flex; gap:6px; justify-content:flex-end; margin:-6px 0 8px; }
  #zoomBar button { min-width:36px; background:var(--panel); }
  #bar { display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; padding:8px 16px; background:var(--panel); border-top:1px solid var(--line); }
  #bar label { font-size:12px; color:var(--muted); }
  #cur { flex:1 1 260px; min-width:200px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); font:14px ui-monospace, Consolas, Menlo, monospace; }
  #cur:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  #waits { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
  /* Same red as the bubble in the script, so a chip and its bubble read as one thing. */
  #waits .chip { color:var(--ink); background:rgba(229,56,59,.16); border:1px solid rgba(229,56,59,.55); border-radius:999px; padding:2px 10px; }
  #waits .chip.in { background:rgba(229,56,59,.4); font-weight:600; }
  #helpDlg { width:min(640px, 94vw); max-height:86vh; overflow:auto; padding:0; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); }
  #helpDlg::backdrop { background:rgba(27,36,48,.45); }
  #helpDlg .hh { position:sticky; top:0; display:flex; align-items:center; justify-content:space-between; padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
  #helpDlg h2 { font-size:16px; margin:0; }
  #helpBody { padding:6px 18px 16px; font-size:13px; }
  #helpBody h3 { font-size:13px; margin:16px 0 6px; }
  #helpBody table { border-collapse:collapse; width:100%; }
  #helpBody td { padding:5px 8px 5px 0; vertical-align:top; border-top:1px solid var(--line); }
  #helpBody th { text-align:left; font-weight:600; color:var(--muted); padding:0 8px 4px 0; }
  #helpBody td:first-child { white-space:nowrap; width:1%; }
  #helpBody svg { vertical-align:middle; }
  /* Narrow screens stack the panels: the divider becomes a strip (no dragging) that still holds the toggle. */
  @media (max-width:760px){
    main { grid-template-columns:1fr; grid-template-rows: 45% 12px 1fr; }
    main.collapsed { grid-template-columns:1fr; grid-template-rows: 0 12px 1fr; }
    #divider, main.collapsed #divider { cursor:default; }
    #togglePanel { top:0; left:auto; right:12px; width:34px; height:12px; line-height:10px; border-radius:0 0 6px 6px; }
  }
</style>
</head>
<body>
<header>
  <h1>Shorthand → Schematic <small style="font-weight:400;color:var(--muted)">V5</small></h1>
  <button id="ex">Load example</button>
  <button id="svg">Download SVG</button>
  <button id="png">Download PNG</button>
  <button id="help" aria-haspopup="dialog">Help</button>
</header>
<dialog id="helpDlg" aria-labelledby="helpTitle">
  <div class="hh"><h2 id="helpTitle">Legend</h2><button id="helpClose" aria-label="Close help">Close</button></div>
  <div id="helpBody"></div>
</dialog>
<main>
  <div class="left" id="leftPanel">
    <div class="ed"><div id="bd"><div id="bdIn"></div></div><textarea id="src" spellcheck="false"></textarea></div>
    <div id="msgs"></div>
  </div>
  <div id="divider" role="separator" aria-orientation="vertical" aria-label="Script panel border: drag or use the arrow keys to resize" tabindex="0">
    <button id="togglePanel" aria-expanded="true" aria-controls="leftPanel" aria-label="Hide script panel" title="Hide script panel">&lsaquo;</button>
  </div>
  <div class="right" id="rightPanel">
    <div id="zoomBar" role="group" aria-label="Zoom">
      <button id="zOut" aria-label="Zoom out">&minus;</button>
      <button id="zFit" aria-label="Fit the diagram to the width"><span id="zPct">100%</span></button>
      <button id="zIn" aria-label="Zoom in">+</button>
    </div>
    <div id="out"></div>
  </div>
</main>
<footer id="bar">
  <label for="cur">Current line</label>
  <input id="cur" type="text" spellcheck="false" autocomplete="off" placeholder="*A, B\ branch wait">
  <div id="waits" aria-live="polite"></div>
</footer>

<script>
// ==CORE-START==
const EXAMPLE = `*Schematic\\
*S, A\\ series
*A_1\\ branch wait
*A_2, B_2\\ branch return^2
*B_1\\ return
*B\\ series
*C, D\\ series
*E\\ end
*\\
`;

// The file always holds * and \ (the period is only a typing hotkey, see the editor code). One reading
// applies to every file: levels come from the commands, typed indentation and "meet" are ignored. The old
// v1 example gives the same picture under this reading, so no separate old-file parser is kept.
function parse(src, opts) {
  const errors = [], warnings = [];
  const lines = src.replace(/\t/g, '   ').split(/\r?\n/);
  return parseV2(lines, !!(opts && opts.partial), errors, warnings);
}

// Tolerates "return2" as well as "return^2" so the parser still works if the editor's
// auto-conversion was bypassed (paste, another editor).
// Element shapes are written first in the comment, one per element in order, before any location command:
// "*A, B\ tri, rect, branch wait". A shape can be a word or a letter (tentative, like SHORT); "auto" keeps the
// default look (pill for the start, flag for the end, plain box otherwise). Elements past the list get auto.
const SHAPE_WORDS = { rect: 'rect', rectangle: 'rect', x: 'rect', tri: 'tri', triangle: 'tri', t: 'tri',
  circ: 'circ', circle: 'circ', c: 'circ', dia: 'dia', diamond: 'dia', d: 'dia', auto: 'auto' };
// Wider than a box so the label still fits inside a triangle, circle or diamond.
const SHAPE_WIDTH = { tri: 1.3, circ: 1.15, dia: 1.45 };
function splitShapes(comment, n) {
  const shapes = [];
  let rest = comment;
  while (shapes.length < n) {
    const m = rest.match(/^\s*([A-Za-z]+)\s*(?:,|\s|$)/);
    const s = m && SHAPE_WORDS[m[1].toLowerCase()];
    if (!s) break;
    shapes.push(s); rest = rest.slice(m[0].length);
  }
  return { shapes, rest };
}

// Click on a block: the shape that comes next. Start and end blocks also get a step back to their default look.
function nextShape(n) {
  const seq = n.role ? ['auto', 'tri', 'circ', 'dia', 'rect'] : ['rect', 'tri', 'circ', 'dia'];
  return seq[(seq.indexOf(n.shape || (n.role ? 'auto' : 'rect')) + 1) % seq.length];
}

// Write one element's shape into its script line. Earlier elements without a shape get a filler (defaults[i]:
// "auto" for start/end blocks, "rect" otherwise) so the list stays in element order; trailing defaults are dropped.
function setShape(text, ln, idx, shape, defaults) {
  const lines = text.split('\n');
  const m = (lines[ln - 1] || '').match(/^(\s*\*\s*([^\\]*?)\s*\\)\s*(.*)$/);
  if (!m) return text;
  const n = m[2].split(',').map(s => s.trim()).filter(Boolean).length;
  const sp = splitShapes(m[3], n);
  const list = [];
  for (let i = 0; i < n; i++) list.push(sp.shapes[i] || null);
  list[idx] = shape;
  while (list.length && (list[list.length - 1] === null || list[list.length - 1] === 'auto')) list.pop();
  const toks = list.map((s, i) => s || (defaults && defaults[i]) || 'rect');
  const rest = sp.rest.trim().replace(/^,\s*/, '');
  const comment = [toks.join(', '), rest].filter(Boolean).join(', ');
  lines[ln - 1] = m[1] + (comment ? ' ' + comment : '');
  return lines.join('\n');
}

// Command shorthand. Tentative: the letters may change, so they live in this one table. "r2" is "return2".
const SHORT = { s: 'series', b: 'branch', w: 'wait', e: 'end', r: 'return' };
function expandShorthand(c) {
  return c.replace(/(^|[^\w^])(r\^?\d+|[rbwes])(?![\w^])/gi, (m, pre, t) => {
    t = t.toLowerCase();
    return pre + (t.length > 1 ? 'return^' + t.replace(/\D/g, '') : SHORT[t]);
  });
}

function readCommands(comment) {
  const c = expandShorthand(comment.toLowerCase());
  const r = c.match(/\breturn\s*(?:\^\s*)?(\d+)?/);
  return {
    branch: /\bbranch\b/.test(c), wait: /\bwait\b/.test(c),
    ret: !!r, retN: r && r[1] ? Math.max(1, +r[1]) : 1,
    end: /\bend\b/.test(c),
  };
}

// partial=true is for text still being typed: an unclosed "*A, B" line is read as an element list
// with no command yet, so the preview and the highlight work before the closing backslash exists.
function parseV2(lines, partial, errors, warnings) {
  const LINE = /^\s*\*\s*([^\\]*?)\s*\\\s*(.*)$/;
  const OPEN = /^\s*\*\s*([^\\]*?)\s*$/;
  let lastIdx = -1;
  lines.forEach((l, i) => { if (l.trim()) lastIdx = i; });

  const nodes = [], edges = [];
  const addNode = o => { o.id = nodes.length; nodes.push(o); return o; };
  const link = (a, b) => edges.push([a.id, b.id]);
  const junction = lane => addNode({ type: 'junction', lane, w: 10 });

  const main = { lane: 0, cursor: null, order: 0, lines: [], state: 'main' };
  // waiting[k] is the path at level k: the main path, then each branch that is still open.
  const waiting = [main];
  const all = [], pending = [], levels = new Map(), info = new Map();
  let laneCount = 1, orderCount = 1, first = true, title = 'Schematic', started = false;

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    if (!raw.trim()) continue;
    let body, comment, m = raw.match(LINE);
    if (m) { body = m[1]; comment = m[2]; }
    else if (partial && i === lastIdx && (m = raw.match(OPEN))) {
      if (m[1] === '') continue; // only the opening asterisk so far
      body = m[1]; comment = '';
    } else { errors.push(`Line ${i + 1}: expected the form *elements\\ comment`); continue; }

    const ln = i + 1;
    if (!started) { title = body || 'Schematic'; started = true; continue; }
    if (body === '') break; // closing *\
    const els = body.split(',').map(s => s.trim()).filter(Boolean);
    if (!els.length) { errors.push(`Line ${ln}: no elements`); continue; }
    const sh = splitShapes(comment, els.length); // shapes come first, then the location commands
    const cmd = readCommands(sh.rest);

    const top = waiting[waiting.length - 1];
    let f = top;
    levels.set(ln, cmd.branch ? waiting.length : waiting.length - 1);
    if (cmd.branch) {
      if (!top.cursor) { errors.push(`Line ${ln}: branch before any element`); continue; }
      const j = junction(top.lane);
      link(top.cursor, j);
      top.cursor = j;
      f = { lane: laneCount++, cursor: j, order: orderCount++, lines: [], state: 'open' };
      all.push(f);
    }
    f.lines.push(ln);

    let lastEl = null;
    for (const [i, label] of els.entries()) {
      const shape = sh.shapes[i] && sh.shapes[i] !== 'auto' ? sh.shapes[i] : undefined;
      const base = Math.max(56, 16 + label.replace('_', '').length * 10);
      // ln and idx say which script line and which element of it this block is, so a click can edit that line
      const n = addNode({ type: 'el', label, lane: f.lane, shape, ln, idx: i, w: Math.round(base * (SHAPE_WIDTH[shape] || 1)) });
      if (first) { n.role = 'start'; first = false; }
      if (f.cursor) link(f.cursor, n);
      f.cursor = n; lastEl = n;
    }
    if (cmd.end) lastEl.role = 'end';

    // A line on a path claims the oldest pending return aimed at that path, so no "meet" keyword is needed.
    const cand = pending.filter(p => !p.done && p.target === f).sort((a, b) => a.order - b.order)[0];
    if (cand) {
      const j = junction(f.lane);
      link(f.cursor, j); f.cursor = j;
      link(cand.last, j); cand.done = true;
    }

    let closedLane = null;
    if (cmd.branch) {
      if (cmd.ret) { // closed branch: "wait" on the same line adds nothing, the return is pending anyway
        const target = waiting[Math.max(0, waiting.length - cmd.retN)];
        f.pend = { last: f.cursor, target, order: f.order, done: false, ln };
        pending.push(f.pend);
        f.state = 'pending'; closedLane = f.lane;
      } else if (cmd.wait) { waiting.push(f); f.state = 'waiting'; }
      else f.state = 'ended'; // plain branch terminates at its last element
    } else if (cmd.ret) {
      const idx = waiting.length - 1;
      if (idx === 0) warnings.push(`Line ${ln}: return on the main path ignored`);
      else {
        const target = waiting[Math.max(0, idx - cmd.retN)];
        f.pend = { last: f.cursor, target, order: f.order, done: false, ln };
        pending.push(f.pend);
        f.state = 'pending'; closedLane = f.lane;
        waiting.pop();
      }
    }
    info.set(ln, { lane: f.lane, before: top.lane, isBranch: cmd.branch, ret: cmd.ret, closedLane });
  }

  // Returns that found no line on their target path merge at the end of that path.
  const endJ = new Map();
  for (const p of pending.filter(p => !p.done)) {
    warnings.push(`Line ${p.ln}: return has no line on its target path to rejoin; merged at the end of that path`);
    let j = endJ.get(p.target);
    if (!j) {
      j = junction(p.target.lane);
      if (p.target.cursor) link(p.target.cursor, j);
      endJ.set(p.target, j);
    }
    link(p.last, j);
  }

  const branches = all.map(b => ({
    lane: b.lane, lines: b.lines, order: b.order, target: b.pend ? b.pend.target.lane : null,
    state: waiting.includes(b) ? 'waiting' : (b.pend && !b.pend.done ? 'pending' : (b.pend ? 'joined' : b.state)),
  }));
  return {
    mode: 'v2', title, nodes, edges, lanes: laneCount, errors, warnings,
    levels, info, branches, waitingLanes: waiting.map(w => w.lane),
  };
}

// Strength per lane for the branches that are still waiting on a return. The text is cut at the caret
// line, so what is highlighted matches what has been typed so far. Lane numbers come from the order
// branches open, so they are the same in the cut text and in the whole text.
function highlightAt(src, caretLn) {
  const out = { lanes: new Map(), lines: new Map(), wait: null };
  const all = src.split(/\r?\n/);
  const m = parse(all.slice(0, caretLn).join('\n'), { partial: true });
  // m0 is the text above the caret line: what is still unresolved before this line is typed. A line on a
  // path resolves the oldest-created pending return aimed at that path, so that is the one shown strongest.
  const m0 = parse(all.slice(0, caretLn - 1).join('\n'), { partial: true });
  const open = b => b.state === 'waiting' || b.state === 'pending';
  for (const b of m0.branches) if (open(b)) out.lanes.set(b.lane, 'weak');
  for (const b of m.branches) if (open(b)) out.lanes.set(b.lane, 'weak');
  const cur = m.info.get(caretLn);
  const top0 = m0.waitingLanes[m0.waitingLanes.length - 1];
  const due = (cur && cur.isBranch) ? null
    : m0.branches.filter(b => b.state === 'pending' && b.target === top0).sort((a, b) => a.order - b.order)[0];
  // Without a rejoin due, fall back to the open branch the line continues; once "return" is on the line
  // it narrows to the branch that return closes (or, on a branch line, the new branch).
  const strong = due ? due.lane
    : cur ? (cur.ret ? (cur.isBranch ? cur.lane : cur.before) : cur.before) : top0;
  if (strong > 0 && out.lanes.has(strong)) out.lanes.set(strong, 'strong');
  for (const b of m.branches.concat(m0.branches)) {
    const s = out.lanes.get(b.lane);
    if (!s) continue;
    for (const ln of b.lines) if (s === 'strong' || !out.lines.has(ln)) out.lines.set(ln, s);
  }
  // Red bubble on the "wait" of the innermost open branch, but only while the caret line sits on that
  // branch's own level. A branch line is one level deeper, so branching off from inside it shows nothing,
  // and once "return" is on the line the branch is no longer waiting, so the bubble clears.
  out.wait = null;
  const top = cur ? cur.before : m.waitingLanes[m.waitingLanes.length - 1];
  const nested = !!(cur && cur.isBranch);
  const wb = m.branches.find(b => b.lane === top);
  if (top > 0 && !nested && wb && wb.state === 'waiting') {
    const ln = wb.lines[0], raw = src.split(/\r?\n/)[ln - 1];
    const cs = commentStart(raw);
    const w = cs < 0 ? null : raw.slice(cs).match(/(^|[^\w^])(wait|w)(?![\w^])/i);
    if (w) { const from = cs + w.index + w[1].length; out.wait = { ln, from, to: from + w[2].length }; }
  }
  return out;
}

// Index where the command part of a line starts (just after the closing delimiter), or -1.
function commentStart(raw) {
  const m = raw.match(/^\s*\*\s*[^\\]*?\s*\\\s*(.*)$/);
  return m ? raw.length - m[1].length : -1;
}

// "return2" becomes "return^2" in the command part of a line; the caret moves with the text.
function convertReturnDigits(text, caret) {
  const lines = text.split('\n');
  let pos = 0, shift = 0;
  const done = lines.map(raw => {
    const start = pos; pos += raw.length + 1;
    const m = raw.match(/^\s*\*\s*[^\\]*?\s*\\\s*(.*)$/);
    if (!m) return raw;
    const cut = raw.length - m[1].length;
    let rest = m[1], added = 0;
    rest = rest.replace(/\breturn(\d+)/gi, (all, d, at) => {
      if (start + cut + at + 6 <= caret) added++;
      return 'return^' + d;
    });
    shift += added;
    return raw.slice(0, cut) + rest;
  });
  return { text: done.join('\n'), caret: caret + shift };
}

// Everything can be typed on one line: an asterisk that opens a new element list (one that comes after a
// closed list on the same line) starts a new line. An asterisk inside an open list is left alone.
function splitSequences(text, caret) {
  let pos = 0, shift = 0, cc = caret;
  const out = text.split('\n').map(raw => {
    const start = pos; pos += raw.length + 1;
    let inList = false, seen = false;
    const cuts = [];
    for (let k = 0; k < raw.length; k++) {
      if (!inList && raw[k] === '*') { if (seen) cuts.push(k); inList = true; seen = true; }
      else if (inList && raw[k] === '\\') inList = false;
    }
    if (!cuts.length) return raw;
    let res = '', last = 0;
    for (const k of cuts) {
      const seg = raw.slice(last, k), kept = seg.replace(/\s+$/, ''), removed = seg.length - kept.length;
      const a = start + k;
      if (cc > a - removed && cc < a) cc = a; // a caret in the dropped spaces lands on the new line
      if (cc >= a) shift += 1 - removed;
      res += kept + '\n'; last = k;
    }
    return res + raw.slice(last);
  });
  return { text: out.join('\n'), caret: cc + shift };
}

// Indentation is derived from the commands (three spaces per level) and typed spaces are discarded.
function reindentWithCaret(text, caret) {
  const m = parse(text, { partial: true });
  const lines = text.split('\n');
  let pos = 0, delta = 0, newCaret = caret;
  const out = lines.map((raw, i) => {
    const start = pos; pos += raw.length + 1;
    const onCaret = caret >= start && caret <= start + raw.length;
    let level = m.levels.get(i + 1);
    if (level === undefined) {
      // A fresh blank line under the caret starts at the level a plain line would have there, so the
      // first character typed already sits in the right place.
      // (a line holding only the opening asterisk counts as blank: nothing typed after it yet)
      if (!(onCaret && (!raw.trim() || /^\s*\*\s*$/.test(raw)) && i > 0)) return raw;
      level = Math.max(0, parse(lines.slice(0, i).join('\n'), { partial: true }).waitingLanes.length - 1);
    }
    const oldInd = raw.length - raw.trimStart().length;
    const ind = ' '.repeat(3 * level);
    if (onCaret) {
      // caret keeps its place inside the line's content, after the shift from every earlier line
      newCaret = Math.max(caret + delta + ind.length - oldInd, start + delta + ind.length);
    }
    delta += ind.length - oldInd;
    return ind + raw.trimStart();
  });
  // a caret past the last indented line only shifts by the total change
  if (caret > pos - 1) newCaret = caret + delta;
  return { text: out.join('\n'), caret: Math.max(0, newCaret) };
}

// Waits still open once the text through the caret line is read, outermost first. The last one is the
// innermost: the one the next plain line continues and the next "return" closes.
function openWaits(src, caretLn) {
  const all = src.split(/\r?\n/);
  const m = parse(all.slice(0, caretLn).join('\n'), { partial: true });
  const open = m.branches.filter(b => b.state === 'waiting');
  return open.map((b, i) => {
    const body = (all[b.lines[0] - 1].match(/^\s*\*\s*([^\\]*?)\s*\\/) || [, ''])[1];
    return { ln: b.lines[0], text: body, innermost: i === open.length - 1 };
  });
}

// Result shape shared by the three box helpers: new text, caret offset, the line the caret is on (1-based),
// that line without its tabs (what the box shows) and the caret offset inside it.
function lineResult(t, c) {
  const ln = t.slice(0, c).split('\n').length;
  const ls = t.lastIndexOf('\n', c - 1) + 1;
  const end = t.indexOf('\n', ls), raw = t.slice(ls, end < 0 ? undefined : end);
  const ind = raw.length - raw.trimStart().length;
  return { text: t, caret: c, ln, line: raw.trimStart(), barCaret: Math.max(0, c - ls - ind) };
}

// The bottom box edits one script line. This puts the box's text into line caretLn, then runs the same
// clean-up as the script editor (return2, one-line splitting, tabbing).
function barEdit(text, caretLn, value, valueCaret) {
  const lines = text.split('\n');
  while (lines.length < caretLn) lines.push('');
  lines[caretLn - 1] = value;
  let t = lines.join('\n');
  let c = lines.slice(0, caretLn - 1).join('\n').length + (caretLn > 1 ? 1 : 0) + (valueCaret == null ? value.length : valueCaret);
  let r = convertReturnDigits(t, c); t = r.text; c = r.caret;
  r = splitSequences(t, c); t = r.text; c = r.caret;
  r = reindentWithCaret(t, c);
  return lineResult(r.text, r.caret);
}

// Enter in the box: a new line under the current one, tabbed to the level a plain line has there.
function barEnter(text, caretLn) {
  const lines = text.split('\n');
  lines.splice(caretLn, 0, '');
  const r = reindentWithCaret(lines.join('\n'), lines.slice(0, caretLn).join('\n').length + 1);
  return lineResult(r.text, r.caret);
}

// Backspace in an empty box: drop that empty line and go back to the end of the one above.
function barBack(text, caretLn) {
  if (caretLn < 2) return null;
  const lines = text.split('\n');
  lines.splice(caretLn - 1, 1);
  return lineResult(lines.join('\n'), lines.slice(0, caretLn - 1).join('\n').length);
}

const CFG = { H: 44, GAP: 46, LANE: 84, TOP: 78, LEFT: 36 };

function layout(model) {
  const { nodes, edges } = model;
  const inc = nodes.map(() => []);
  edges.forEach(([a, b]) => inc[b].push(a));
  const layer = nodes.map(() => 0);
  nodes.forEach((n, i) => { layer[i] = inc[i].length ? Math.max(...inc[i].map(a => layer[a])) + 1 : 0; });
  const nLayers = Math.max(0, ...layer) + 1;
  const colW = new Array(nLayers).fill(0);
  nodes.forEach((n, i) => { colW[layer[i]] = Math.max(colW[layer[i]], n.w); });
  const colX = []; let cum = CFG.LEFT;
  for (let l = 0; l < nLayers; l++) { colX[l] = cum + colW[l] / 2; cum += colW[l] + CFG.GAP; }
  nodes.forEach((n, i) => { n.x = colX[layer[i]]; n.y = CFG.TOP + n.lane * CFG.LANE; });
  model.width = Math.max(360, cum - CFG.GAP + CFG.LEFT);
  model.height = CFG.TOP + (model.lanes - 1) * CFG.LANE + CFG.H / 2 + 40;
  return model;
}

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const INK = '#1b3a8a';
const HL = { strong: { stroke: '#d9480f', fill: '#ffe8d9', w: 3 }, weak: { stroke: '#d98a1f', fill: '#fff4e0', w: 2.5 } };

function labelSVG(label, x, y) {
  const m = label.match(/^([^_]*)_(.+)$/);
  const inner = m ? `${esc(m[1])}<tspan dy="5" font-size="12">${esc(m[2])}</tspan>` : esc(label);
  return `<text x="${x}" y="${y + 5}" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="17" fill="${INK}">${inner}</text>`;
}

function shapeSVG(kind, x0, y0, w, h, fill, stroke, sw) {
  const a = `fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"`;
  const poly = pts => `<polygon points="${pts.map(p => p.join(',')).join(' ')}" ${a}/>`;
  if (kind === 'pill') return `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="${h / 2}" ${a}/>`;
  if (kind === 'flag') return poly([[x0, y0], [x0 + w, y0], [x0 + w, y0 + h - 14], [x0 + w - 14, y0 + h], [x0, y0 + h]]);
  if (kind === 'tri') return poly([[x0, y0], [x0, y0 + h], [x0 + w, y0 + h / 2]]);
  if (kind === 'circ') return `<ellipse cx="${x0 + w / 2}" cy="${y0 + h / 2}" rx="${w / 2}" ry="${h / 2}" ${a}/>`;
  if (kind === 'dia') return poly([[x0 + w / 2, y0], [x0 + w, y0 + h / 2], [x0 + w / 2, y0 + h], [x0, y0 + h / 2]]);
  return `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="5" ${a}/>`;
}

// hl is the lane to strength map from highlightAt; omit it for a clean drawing (downloads).
// interactive adds the click targets used on screen; downloads leave them out.
function renderSVG(model, hl, interactive) {
  layout(model);
  const { nodes, edges, width, height, title } = model;
  const rank = s => s === 'strong' ? 2 : s === 'weak' ? 1 : 0;
  const hlOf = n => (hl && n.type === 'el') ? hl.get(n.lane) : undefined;
  const o = [];
  o.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`);
  o.push(`<rect width="100%" height="100%" fill="#fff"/>`);
  o.push(`<text x="16" y="28" font-family="system-ui, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#444">${esc(title)}</text>`);
  // wires: a highlighted branch also colors the wires that enter and leave it
  for (const [a, b] of edges) {
    const u = nodes[a], v = nodes[b];
    let d;
    if (u.lane === v.lane) d = `M${u.x + u.w / 2} ${u.y} H${v.x - v.w / 2}`;
    else if (v.type === 'junction') d = `M${u.x + u.w / 2} ${u.y} H${v.x} V${v.y}`;
    else d = `M${u.x} ${u.y} V${v.y} H${v.x - v.w / 2}`;
    const su = hlOf(u), sv = hlOf(v);
    const s = rank(su) >= rank(sv) ? su : sv;
    const st = s ? HL[s] : null;
    o.push(`<path d="${d}" fill="none" stroke="${st ? st.stroke : INK}" stroke-width="${st ? st.w : 2}" stroke-linejoin="round"/>`);
  }
  const h = CFG.H;
  for (const n of nodes) {
    if (n.type === 'junction') { o.push(`<circle cx="${n.x}" cy="${n.y}" r="3.5" fill="${INK}"/>`); continue; }
    const st = hlOf(n) ? HL[hlOf(n)] : null;
    const stroke = st ? st.stroke : INK, sw = st ? st.w : 2;
    const x0 = n.x - n.w / 2, y0 = n.y - h / 2;
    // A written shape wins over the start/end look; wires meet every shape at its left and right middle.
    const kind = n.shape || (n.role === 'start' ? 'pill' : n.role === 'end' ? 'flag' : 'rect');
    const fill = st ? st.fill : (kind === 'pill' || kind === 'flag' ? '#eaf0ff' : '#fff');
    if (interactive) o.push(`<g class="blk" data-ln="${n.ln}" data-idx="${n.idx}" style="cursor:pointer"><title>Click to change shape</title>`);
    o.push(shapeSVG(kind, x0, y0, n.w, h, fill, stroke, sw));
    // a triangle is heavier at its flat left side, so its label sits left of centre
    o.push(labelSVG(n.label, kind === 'tri' ? x0 + n.w * 0.38 : n.x, n.y));
    if (interactive) o.push('</g>');
  }
  o.push('</svg>');
  return o.join('\n');
}

// Node-side check: edges by label so a person can compare them to the sketch without reading ids.
function edgeList(model) {
  const nm = n => n.type === 'junction' ? 'J' + n.id : n.label;
  return model.edges.map(([a, b]) => nm(model.nodes[a]) + ' -> ' + nm(model.nodes[b]));
}

    if (sv) {
      const w = +lastSVG.match(/width="(\d+)"/)[1], h = +lastSVG.match(/height="(\d+)"/)[1];
      sv.setAttribute('width', w * zoom); sv.setAttribute('height', h * zoom);
    }
    zPct.textContent = Math.round(zoom * 100) + '%';
  }
  function setZoom(z) {
    zoom = Math.min(4, Math.max(0.25, z));
    try { localStorage.setItem('shorthand_schematic_v5_zoom', String(zoom)); } catch (e) {}
    applyZoom();
  }
  document.getElementById('zIn').onclick = () => setZoom(zoom * 1.25);
  document.getElementById('zOut').onclick = () => setZoom(zoom / 1.25);
  // The percent button fits the drawing to the panel width (a second press with nothing to fit returns to 100%).
  document.getElementById('zFit').onclick = () => {
    if (!lastSVG) return;
    const fit = (rightEl.clientWidth - 44) / +lastSVG.match(/width="(\d+)"/)[1];
    setZoom(Math.abs(fit - zoom) < 0.01 ? 1 : fit);
  };
  // The wheel zooms (a pinch gesture arrives as ctrl + wheel and zooms too). The point under the cursor stays put.
  // Moving around the zoomed drawing is by dragging it or with the scroll bars.
  rightEl.addEventListener('wheel', e => {
    if (e.target.closest('#zoomBar')) return;
    e.preventDefault();
    const dy = Math.max(-120, Math.min(120, e.deltaY * (e.deltaMode === 1 ? 33 : 1)));
    const old = zoom, r = out.getBoundingClientRect();
    const px = (e.clientX - r.left) / old, py = (e.clientY - r.top) / old;
    setZoom(old * Math.exp(-dy * 0.002));
    if (zoom === old) return;
    const r2 = out.getBoundingClientRect();
    rightEl.scrollLeft += r2.left + px * zoom - e.clientX;
    rightEl.scrollTop += r2.top + py * zoom - e.clientY;
  }, { passive: false });

  // Drag the diagram to pan it. A drag never counts as a click, so it cannot change a block's shape.
  let pan = null, suppressClick = false;
  rightEl.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('#zoomBar')) return;
    pan = { x: e.clientX, y: e.clientY, sl: rightEl.scrollLeft, st: rightEl.scrollTop, moved: false, id: e.pointerId };
  });
  rightEl.addEventListener('pointermove', e => {
    if (!pan) return;
    const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
    if (!pan.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    if (!pan.moved) { pan.moved = true; rightEl.setPointerCapture(pan.id); rightEl.classList.add('panning'); }
    rightEl.scrollLeft = pan.sl - dx; rightEl.scrollTop = pan.st - dy;
  });
  const endPan = () => {
    if (pan && pan.moved) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 0); }
    pan = null; rightEl.classList.remove('panning');
  };
  rightEl.addEventListener('pointerup', endPan);
  rightEl.addEventListener('pointercancel', endPan);

  // Click a block to step its shape; the matching word is written into that script line.
  out.addEventListener('click', e => {
    const g = e.target.closest('.blk');
    if (!g || suppressClick) return;
    const ln = +g.dataset.ln, idx = +g.dataset.idx, text = src.value, model = parse(text);
    const els = model.nodes.filter(n => n.type === 'el' && n.ln === ln).sort((a, b) => a.idx - b.idx);
    if (!els[idx]) return;
    const t = setShape(text, ln, idx, nextShape(els[idx]), els.map(n => n.role ? 'auto' : 'rect'));
    if (t === text) return;
    // keep the caret on the same line and column even though a line above it may have grown
    const before = text.slice(0, src.selectionStart).split('\n'), cl = before.length - 1, col = before[cl].length;
    const nl = t.split('\n');
    let pos = 0; for (let i = 0; i < cl; i++) pos += nl[i].length + 1;
    setText(t, pos + Math.min(col, (nl[cl] || '').length));
    update();
  });

  // Collapse the script panel so the diagram gets the whole width; the choice is remembered per browser.
  const mainEl = document.querySelector('main'), toggleBtn = document.getElementById('togglePanel');
  function setCollapsed(on) {
    mainEl.classList.toggle('collapsed', on);
    // the chevron on the panel's border points the way the panel will move
    toggleBtn.innerHTML = on ? '&rsaquo;' : '&lsaquo;';
    const label = on ? 'Show script panel' : 'Hide script panel';
    toggleBtn.title = label; toggleBtn.setAttribute('aria-label', label);
    toggleBtn.setAttribute('aria-expanded', String(!on));
    try { localStorage.setItem('shorthand_schematic_v5_collapsed', on ? '1' : '0'); } catch (e) {}
  }
  toggleBtn.onclick = () => setCollapsed(!mainEl.classList.contains('collapsed'));
  let wasCollapsed = false; try { wasCollapsed = localStorage.getItem('shorthand_schematic_v5_collapsed') === '1'; } catch (e) {}
  setCollapsed(wasCollapsed);

  // The script panel's right border is a divider: drag it (or use the arrow keys) to set the panel width.
  // The width is kept in pixels, between 140px and 70% of the page, and remembered per browser.
  const divider = document.getElementById('divider'), leftEl = document.getElementById('leftPanel');
  const stacked = () => window.matchMedia('(max-width:760px)').matches; // stacked layout has nothing to resize
  const setLeftW = px => {
    const w = Math.round(Math.max(140, Math.min(mainEl.getBoundingClientRect().width * 0.7, px)));
    mainEl.style.setProperty('--leftw', w + 'px');
    try { localStorage.setItem('shorthand_schematic_v5_leftw', String(w)); } catch (e) {}
  };
  try { const w = +localStorage.getItem('shorthand_schematic_v5_leftw'); if (w) mainEl.style.setProperty('--leftw', w + 'px'); } catch (e) {}
  let dragging = false;
  divider.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('#togglePanel') || stacked() || mainEl.classList.contains('collapsed')) return;
    dragging = true; divider.setPointerCapture(e.pointerId); divider.classList.add('drag'); e.preventDefault();
  });
  divider.addEventListener('pointermove', e => { if (dragging) setLeftW(e.clientX - mainEl.getBoundingClientRect().left); });
  const endDrag = () => { dragging = false; divider.classList.remove('drag'); };
  divider.addEventListener('pointerup', endDrag);
  divider.addEventListener('pointercancel', endDrag);
  divider.addEventListener('dblclick', e => { // double-click goes back to the default width
    if (e.target.closest('#togglePanel') || stacked()) return;
    mainEl.style.removeProperty('--leftw');
    try { localStorage.removeItem('shorthand_schematic_v5_leftw'); } catch (err) {}
  });
  divider.addEventListener('keydown', e => {
    if ((e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') || stacked() || mainEl.classList.contains('collapsed')) return;
    e.preventDefault();
    setLeftW(leftEl.getBoundingClientRect().width + (e.key === 'ArrowRight' ? 20 : -20));
  });
  src.addEventListener('scroll', syncScroll);
  ['keyup', 'click', 'focus', 'blur'].forEach(ev => src.addEventListener(ev, update));
  // Text that arrives whole (examples, saved text, paste) is tabbed immediately, not only after the next keystroke.
  const tidy = t => reindentWithCaret(t, 0).text;
  document.getElementById('ex').onclick = () => { src.value = tidy(EXAMPLE); update(); };
  document.getElementById('svg').onclick = () => { if (lastSVG) download('schematic.svg', new Blob([lastSVG], { type: 'image/svg+xml' })); };
  document.getElementById('png').onclick = () => {
    if (!lastSVG) return;
    const img = new Image(), m = lastSVG.match(/width="(\d+)" height="(\d+)"/), s = 2;
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = m[1] * s; c.height = m[2] * s;
      const g = c.getContext('2d'); g.scale(s, s); g.drawImage(img, 0, 0);
      c.toBlob(b => download('schematic.png', b));
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(lastSVG);
  };
  let saved = ''; try { saved = localStorage.getItem('shorthand_schematic_v5_src') || ''; } catch (e) {}
  src.value = tidy(saved || EXAMPLE);
  src.setSelectionRange(src.value.length, src.value.length); // the box starts on the last line, ready to type
  update();
}
</script>
</body>
</html>
