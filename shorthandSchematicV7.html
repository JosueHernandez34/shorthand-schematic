    wide('Prefixes', '<code>p</code> pico, <code>n</code> nano, <code>u</code> or <code>µ</code> micro, <code>m</code> milli, <code>k</code> kilo, <code>M</code> mega, <code>G</code> giga.') +
    wide('Direction', 'Parts with a direction (<code>VS</code> <code>IS</code> <code>DVS</code> <code>DIS</code> <code>VAC</code> <code>IAC</code> <code>D</code>) are drawn negative to positive along the path, so current flows left to right. Write <code>REV</code> in the entry of a part to reverse it: <code>*V1\\ VS REV = 5</code> is a 5 V source drawn positive to negative. On other parts <code>REV</code> is ignored with a warning.') +
    wide('Measure', 'Write <code>MEAS V</code> (shorthand <code>m</code>) in the entry of a part to mark the voltage across it, <code>MEAS I</code> for the current through it; <code>MEAS</code> alone means V. <code>*R_1\\ RES = 4.7k; MEAS V</code> draws <code>+ V &minus;</code> over the resistor, + where the current enters (left, or right on a part marked <code>REV</code>); <code>MEAS I</code> draws an arrow the way the current flows. The solver fills in the number (see Simulation); an AC reading takes a form after <code>MEAS</code>: <code>POLE</code>, <code>RECT</code> or <code>SINE</code> (see AC). A source cannot measure its own quantity (no <code>MEAS V</code> on a voltage source, no <code>MEAS I</code> on a current source): that is an error. On a flow block <code>MEAS</code> is ignored with a warning.') +
    wide('Ground and checks', 'Nothing is grounded unless you write it: put <code>GND</code> where 0 V is, one <code>GND</code> first or last on the path is enough, because it joins both ends of the circuit (<code>*V1, R1, GND\\ VS = 5, RES = 1k, GND; MEAS I,</code>); a <code>GND</code> in the middle is only a reference point, and two or more are written out where you want them. Entries and elements pair up one to one in a group: more entries than elements is an error, fewer a warning (<code>NULL</code> or a bare comma skips one on purpose). Entries need not be the same kind, and <code>END</code> pairs up like the rest: <code>*DONE, OFF\\ PINK, BLACK; NULL, END</code> ends OFF. Brackets hold several specifiers for one element: <code>[BLUE, PROC = cool down]</code>. A circuit with <code>MEAS</code> and no <code>GND</code> is an error. Before solving, the circuit is checked: errors (red X on the parts, no readings) for a loop of only voltage sources and inductors, a node touching only current sources, a repeated part name, and a measured part on a dead-end branch; warnings (amber, still solved) for an open end, a part with both ends on the same node, a group not connected to <code>GND</code>, and more than two <code>GND</code> points.') +
    wide('Simulation', 'When a part has <code>MEAS</code>, the circuit is solved for DC and the marker shows the reading, for example <code>+ 5 V &minus;</code>. CAP is open and IND is a short in DC; DIODE follows the Shockley equation. A dependent source takes <code>[gain*V(name)]</code> or <code>[gain*I(name)]</code> of another part, read the way <code>MEAS</code> reads it. Every part needs a number as its value (a diode needs none). If the circuit cannot be solved, a note under the script says why and the markers keep their quantity only.') +
    wide('AC', 'With <code>VAC</code> or <code>IAC</code> sources the circuit is solved in phasors: CAP is jωC, IND is jωL. Each source keeps its own omega; the circuit is solved once per omega (and once for DC) with the other sources switched off, and the readings add up (superposition). Each marker writes its reading in the form named after <code>MEAS</code>: <code>POLE</code> <code>7.07 V ∠ −45°</code>, <code>RECT</code> <code>5 − j5 V</code> or <code>SINE</code> <code>7.07 cos(1000t − 45°) V</code>, as in <code>MEAS V RECT</code> (polar when none is given; a DC reading is a plain number in every form); a sum names each omega, as in <code>2 V + 3 V ∠ 0° @ 1000 rad/s</code>. A diode with AC sources needs a time simulation, which comes later, so that circuit is not solved.') +
    wide('Several parts','<code>*R1, C1\\ R = 4.7k, C = 10u; red, blue</code>: one entry per part, as for blocks.') +
    wide('Letter case', 'Single letters are case-sensitive: capitals are circuit parts (<code>R C L D</code>), small letters are shapes and commands (<code>c</code> circle, <code>d</code> decision, <code>r</code> return). So <code>C</code> is a capacitor and <code>c</code> a circle. Codes and words longer than one letter match in any case (<code>VS</code> or <code>vs</code>, <code>Branch</code>, <code>PROC</code>, <code>Resistor</code>).') +
    wide('Click a part', `Steps through the parts (${Object.keys(EE).join(', ')}) and writes the code into the script; the value is kept.`) +
    '</table>' +
    '<h3>Diagram</h3><table>' +
    row('<code>&minus;</code> <code>+</code>', 'Zoom out and in. The mouse wheel zooms around the pointer. The canvas is an endless white plane: drag anywhere on it to move the drawing as far as you like. The percent button fits and centers the whole drawing; press it again for 100% at the start corner. Downloads are not affected by zoom or position.') +
    row('&darr; &rarr;', 'The arrow button beside the zoom buttons switches the drawing between left to right and top to bottom (also in Settings). Top to bottom keeps blocks upright, turns circuit parts to run down the page with their name and value beside them, and puts branches in columns to the right.') +
    row('Click a block', 'Steps through its shapes and writes the word into the script (a drag never counts as a click).') +
    '</table><h3>Rejoining</h3><p>A pending return rejoins after the last element of the next line on its target level. When several are pending for the same level, they rejoin in the order the branches were created.</p>' +
    '<h3>Drawing</h3><table>' +
    row(swatch(`<rect x="3" y="3" width="50" height="20" rx="10" fill="${START_FILL}" stroke="${INK}" stroke-width="2"/><text x="28" y="18" text-anchor="middle" font-size="12" font-family="system-ui,sans-serif" fill="${INK}">S</text>`), 'Start: the first element.') +
    row(swatch(box('rx="3" fill="#fff" stroke="' + INK + '"', 'A')), 'Element in series.') +
    row(swatch(`<polygon points="3,3 53,3 53,13 43,23 3,23" fill="${START_FILL}" stroke="${INK}" stroke-width="2"/><text x="26" y="18" text-anchor="middle" font-size="12" font-family="system-ui,sans-serif" fill="${INK}">E</text>`), 'End: the line marked <code>end</code>.') +
    row(swatch(`<circle cx="28" cy="13" r="3.5" fill="${INK}"/>`), 'Junction where a branch leaves or rejoins.') +
    '</table><h3>Highlights while you type</h3><table>' +
    row(swatch(box(`rx="3" fill="${HL.strong.fill}" stroke="${HL.strong.stroke}"`, 'A')), 'Orange: the branch the current line closes or resolves (the oldest-created one).') +
    row(swatch(box(`rx="3" fill="${HL.weak.fill}" stroke="${HL.weak.stroke}"`, 'A')), 'Light orange: other branches still waiting for a return or a rejoin.') +
    row('<span style="background:rgba(229,56,59,.4);border-radius:8px;box-shadow:0 0 0 2px rgba(229,56,59,.4)">wait</span>', 'Red bubble: this branch is waiting for its return. Shown while you work on its level; hidden when you branch off from inside it and cleared once <code>return</code> is written.') +
    '</table>';
  // Settings page: the choices live in SETTINGS (read by the core), are saved per browser, and redraw at once.
  const setDlg = document.getElementById('setDlg'), setForm = document.getElementById('setForm');
  // only known keys are restored, so the AC form an earlier build saved does not come back as a stray setting
  try { const saved = JSON.parse(localStorage.getItem('shorthand_schematic_v7_settings') || '{}'); for (const k of Object.keys(SETTINGS)) if (k in saved) SETTINGS[k] = saved[k]; } catch (e) {}
  for (const k of Object.keys(SETTINGS)) {
    const r = setForm.querySelector(`input[name="${k}"][value="${SETTINGS[k]}"]`);
    if (r) r.checked = true;
  }
  // The direction lives in two places, the Settings page and the arrow button by the zoom buttons; both write the
  // same setting, and the button shows the direction a press switches to.
  const dirBtn = document.getElementById('dirBtn');
  function syncDir() {
    const td = SETTINGS.direction === 'td', label = td ? 'Draw left to right' : 'Draw top to bottom';
    dirBtn.innerHTML = td ? '&rarr;' : '&darr;'; dirBtn.title = label; dirBtn.setAttribute('aria-label', label);
    const r = setForm.querySelector(`input[name="direction"][value="${SETTINGS.direction}"]`);
    if (r) r.checked = true;
  }
  function saveSettings() { try { localStorage.setItem('shorthand_schematic_v7_settings', JSON.stringify(SETTINGS)); } catch (err) {} }
  setForm.addEventListener('change', e => {
    if (!(e.target.name in SETTINGS)) return;
    SETTINGS[e.target.name] = e.target.value;
    saveSettings(); syncDir(); update();
  });
  dirBtn.onclick = () => { SETTINGS.direction = SETTINGS.direction === 'td' ? 'lr' : 'td'; saveSettings(); syncDir(); update(); };
  syncDir();
  document.getElementById('settings').onclick = () => setDlg.showModal();
  document.getElementById('setClose').onclick = () => setDlg.close();
  setDlg.addEventListener('click', e => { if (e.target === setDlg) setDlg.close(); });
  document.getElementById('help').onclick = () => helpDlg.showModal();
  document.getElementById('helpClose').onclick = () => helpDlg.close();
  helpDlg.addEventListener('click', e => { if (e.target === helpDlg) helpDlg.close(); }); // click on the dimmed area
  // Zoom scales the on-screen drawing only (the width and height of the svg; its viewBox keeps the shapes sharp).
  const rightEl = document.getElementById('rightPanel'), zPct = document.getElementById('zPct');
  let zoom = 1; try { zoom = Math.min(4, Math.max(0.25, +localStorage.getItem('shorthand_schematic_v7_zoom') || 1)); } catch (e) {}
  // The canvas is an endless white plane with no scroll bars. view is where the drawing's top-left corner sits on
  // the plane, in screen pixels; it has no limits, so the drawing can be moved anywhere and zoomed around any point.
  const HOME = { x: 40, y: 64 };
  let view = { x: HOME.x, y: HOME.y };
  function applyZoom() {
    const sv = out.querySelector('svg');
    if (sv && lastSVG) {
      const w = +lastSVG.match(/width="(\d+)"/)[1], h = +lastSVG.match(/height="(\d+)"/)[1];
      sv.setAttribute('width', w * zoom); sv.setAttribute('height', h * zoom);
    }
    out.style.transform = `translate(${view.x}px, ${view.y}px)`;
    zPct.textContent = Math.round(zoom * 100) + '%';
  }
  // Zoom keeps the screen point (cx, cy), relative to the canvas, fixed on the same spot of the drawing.
  function setZoom(z, cx, cy) {
    const old = zoom;
    zoom = Math.min(4, Math.max(0.25, z));
    if (cx === undefined) { cx = rightEl.clientWidth / 2; cy = rightEl.clientHeight / 2; }
    view.x = cx - (cx - view.x) * zoom / old;
    view.y = cy - (cy - view.y) * zoom / old;
    try { localStorage.setItem('shorthand_schematic_v7_zoom', String(zoom)); } catch (e) {}
    applyZoom();
  }
  document.getElementById('zIn').onclick = () => setZoom(zoom * 1.25);
  document.getElementById('zOut').onclick = () => setZoom(zoom / 1.25);
  // The percent button fits the whole drawing in view and centers it; pressed again it returns to 100% at the start corner.
  document.getElementById('zFit').onclick = () => {
    if (!lastSVG) return;
    const w = +lastSVG.match(/width="(\d+)"/)[1], h = +lastSVG.match(/height="(\d+)"/)[1];
    const fit = Math.min(4, Math.max(0.25, Math.min((rightEl.clientWidth - 80) / w, (rightEl.clientHeight - 120) / h)));
    if (Math.abs(fit - zoom) < 0.01) { zoom = 1; view = { x: HOME.x, y: HOME.y }; }
    else { zoom = fit; view = { x: (rightEl.clientWidth - w * fit) / 2, y: (rightEl.clientHeight - h * fit) / 2 + 20 }; }
    try { localStorage.setItem('shorthand_schematic_v7_zoom', String(zoom)); } catch (e) {}
    applyZoom();
  };
  // The wheel zooms (a pinch gesture arrives as ctrl + wheel and zooms too) around the pointer.
  rightEl.addEventListener('wheel', e => {
    if (e.target.closest('#zoomBar')) return;
    e.preventDefault();
    const dy = Math.max(-120, Math.min(120, e.deltaY * (e.deltaMode === 1 ? 33 : 1)));
    const r = rightEl.getBoundingClientRect();
    setZoom(zoom * Math.exp(-dy * 0.002), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  // Drag anywhere on the canvas to move the drawing. A drag never counts as a click, so it cannot change a block's shape.
  let pan = null;
  rightEl.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('#zoomBar')) return;
    // The block is read now, not at click time: pressing on the canvas blurs the script, which redraws the
    // diagram before the button comes up, so the click itself would land on a replaced element and be lost.
    const g = e.target.closest('.blk');
    pan = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false, id: e.pointerId,
      blk: g ? { ln: +g.dataset.ln, idx: +g.dataset.idx } : null };
  });
  rightEl.addEventListener('pointermove', e => {
    if (!pan) return;
    const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
    if (!pan.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    if (!pan.moved) { pan.moved = true; rightEl.setPointerCapture(pan.id); rightEl.classList.add('panning'); }
    view.x = pan.vx + dx; view.y = pan.vy + dy;
    applyZoom();
  });
  const endPan = e => {
    // a press and release on a block without dragging steps its shape; a drag never does
    const hit = pan && !pan.moved && pan.blk && e.type === 'pointerup' ? pan.blk : null;
    pan = null; rightEl.classList.remove('panning');
    if (hit) stepShape(hit.ln, hit.idx);
  };
  rightEl.addEventListener('pointerup', endPan);
  rightEl.addEventListener('pointercancel', endPan);

  // Step a block's shape; the matching word is written into that script line.
  function stepShape(ln, idx) {
    const text = src.value, model = parse(text);
    const els = model.nodes.filter(n => n.type === 'el' && n.ln === ln).sort((a, b) => a.idx - b.idx);
    if (!els[idx]) return;
    const t = setShape(text, ln, idx, nextShape(els[idx]), els.map(() => 'auto'));
    if (t === text) return;
    // keep the caret on the same line and column even though a line above it may have grown
    const before = text.slice(0, src.selectionStart).split('\n'), cl = before.length - 1, col = before[cl].length;
    const nl = t.split('\n');
    let pos = 0; for (let i = 0; i < cl; i++) pos += nl[i].length + 1;
    setText(t, pos + Math.min(col, (nl[cl] || '').length));
    update();
  }

  // Collapse the script panel so the diagram gets the whole width; the choice is remembered per browser.
  const mainEl = document.querySelector('main'), toggleBtn = document.getElementById('togglePanel');
  function setCollapsed(on) {
    mainEl.classList.toggle('collapsed', on);
    // the chevron on the panel's border points the way the panel will move
    toggleBtn.innerHTML = on ? '&rsaquo;' : '&lsaquo;';
    const label = on ? 'Show script panel' : 'Hide script panel';
    toggleBtn.title = label; toggleBtn.setAttribute('aria-label', label);
    toggleBtn.setAttribute('aria-expanded', String(!on));
    try { localStorage.setItem('shorthand_schematic_v7_collapsed', on ? '1' : '0'); } catch (e) {}
  }
  toggleBtn.onclick = () => setCollapsed(!mainEl.classList.contains('collapsed'));
  let wasCollapsed = false; try { wasCollapsed = localStorage.getItem('shorthand_schematic_v7_collapsed') === '1'; } catch (e) {}
  setCollapsed(wasCollapsed);

  // The script panel's right border is a divider: drag it (or use the arrow keys) to set the panel width.
  // The width is kept in pixels, between 140px and 70% of the page, and remembered per browser.
  const divider = document.getElementById('divider'), leftEl = document.getElementById('leftPanel');
  const stacked = () => window.matchMedia('(max-width:760px)').matches; // stacked layout has nothing to resize
  const setLeftW = px => {
    const w = Math.round(Math.max(140, Math.min(mainEl.getBoundingClientRect().width * 0.7, px)));
    mainEl.style.setProperty('--leftw', w + 'px');
    try { localStorage.setItem('shorthand_schematic_v7_leftw', String(w)); } catch (e) {}
  };
  try { const w = +localStorage.getItem('shorthand_schematic_v7_leftw'); if (w) mainEl.style.setProperty('--leftw', w + 'px'); } catch (e) {}
  let dragging = false;
  divider.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('#togglePanel') || stacked() || mainEl.classList.contains('collapsed')) return;
    dragging = true; divider.setPointerCapture(e.pointerId); divider.classList.add('drag'); e.preventDefault();
  });
  divider.addEventListener('pointermove', e => { if (dragging) setLeftW(e.clientX - mainEl.getBoundingClientRect().left); });
  const endDrag = () => { dragging = false; divider.classList.remove('drag'); };
  divider.addEventListener('pointerup', endDrag);
  divider.addEventListener('pointercancel', endDrag);
  divider.addEventListener('dblclick', e => { // double-click goes back to the default width
    if (e.target.closest('#togglePanel') || stacked()) return;
    mainEl.style.removeProperty('--leftw');
    try { localStorage.removeItem('shorthand_schematic_v7_leftw'); } catch (err) {}
  });
  divider.addEventListener('keydown', e => {
    if ((e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') || stacked() || mainEl.classList.contains('collapsed')) return;
    e.preventDefault();
    setLeftW(leftEl.getBoundingClientRect().width + (e.key === 'ArrowRight' ? 20 : -20));
  });
  src.addEventListener('scroll', syncScroll);
  ['keyup', 'click', 'focus', 'blur'].forEach(ev => src.addEventListener(ev, update));
  // moving the caret with the mouse ends the "just written out" state, as any other key does
  src.addEventListener('mousedown', () => { srcJust = false; });
  cur.addEventListener('mousedown', () => { curJust = false; });
  // Text that arrives whole (examples, saved text, paste) is tabbed immediately, not only after the next keystroke.
  const tidy = t => reindentWithCaret(t, 0).text;
  document.getElementById('ex').onclick = () => { src.value = tidy(EXAMPLE); update(); };
  document.getElementById('svg').onclick = () => { if (lastSVG) download('schematic.svg', new Blob([lastSVG], { type: 'image/svg+xml' })); };
  document.getElementById('png').onclick = () => {
    if (!lastSVG) return;
    const img = new Image(), m = lastSVG.match(/width="(\d+)" height="(\d+)"/), s = 2;
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = m[1] * s; c.height = m[2] * s;
      const g = c.getContext('2d'); g.scale(s, s); g.drawImage(img, 0, 0);
      c.toBlob(b => download('schematic.png', b));
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(lastSVG);
  };
  let saved = ''; try { saved = localStorage.getItem('shorthand_schematic_v7_src') || ''; } catch (e) {}
  src.value = tidy(saved || EXAMPLE);
  src.setSelectionRange(src.value.length, src.value.length); // the box starts on the last line, ready to type
  update();
}
</script>
</body>
</html>
