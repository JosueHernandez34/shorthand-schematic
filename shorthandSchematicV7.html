    for (const [i, label] of els.entries()) {
      const p = sp.props[i];
      const shape = p.shape && p.shape !== 'auto' ? p.shape : undefined;
      // A value is what the block shows; the name then sits small above it. Width follows whichever is inside.
      const ee = !!EE[shape];
      // An EE part's value is read in its unit (4.7k on a resistor shows 4.7 kΩ); a block's value is free text.
      const value = ee ? eeValue(shape, p.value) : p.value;
      const shown = value ? value : label.replace('_', '');
      // An EE part sits on the wire with its texts above and below, so it is only as wide as the symbol or the
      // longer text; the leads stretch to fill the rest.
      const w = ee ? Math.max(64, 10 + Math.max(value ? value.length * 8 : 0, SHOW_EE_NAME ? label.length * 7.5 : 0))
        : Math.max(56, 16 + shown.length * (value ? 8.5 : 10)) * (SHAPE_WIDTH[shape] || 1);
      // ln and idx say which script line and which element of it this block is, so a click can edit that line
      // REV only means something on a part with a direction; elsewhere it is ignored with a warning, not an error,
      // because a click that steps a source into a resistor should not break the drawing.
      if (p.rev && !DIRECTIONAL.has(shape)) warnings.push(`Line ${ln}: REV only reverses ${[...DIRECTIONAL].join(', ')}; ignored on ${label}`);
      // MEAS is refused on a source's own quantity (an error: it can only read the value back) and ignored on a
      // flow block (a warning: there is nothing electrical to measure there).
      if (p.oldRect) warnings.push(`Line ${ln}: ${p.oldRect} is no longer a shape (a plain box is the default, and RECT now means the rectangular form after MEAS); ignored on ${label}`);
      if (p.noValue) warnings.push(`Line ${ln}: ${p.noValue} on ${label} has = but nothing after it. Type its value.`);
      let meas = p.meas;
      if (meas && !ee) { warnings.push(`Line ${ln}: MEAS only measures circuit parts; ignored on ${label}`); meas = undefined; }
      // GND is a connection with no two ends to read across, and its marker would sit on top of the ground sign
      else if (meas && shape === 'GND') { warnings.push(`Line ${ln}: GND has nothing to measure; MEAS ignored on ${label}. Put MEAS on a part next to it.`); meas = undefined; }
      else if (meas && OWN_QTY[shape] === meas) {
        errors.push(`Line ${ln}: ${label} is a ${meas === 'V' ? 'voltage' : 'current'} source, so MEAS ${meas} would only read back its own value. Measure ${meas === 'V' ? 'I' : 'V'} instead.`);
        meas = undefined;
      }
      const n = addNode({ type: 'el', label, lane: f.lane, shape, ln, idx: i, value, color: p.color,
        rev: !!(p.rev && DIRECTIONAL.has(shape)), meas, measForm: p.measForm, raw: p.value, w: Math.round(w) });
      if (first) { n.role = 'start'; first = false; }
      // END on the last element of the line is the line's end, with its checks below; on an earlier element it
      // marks that element, and the end rule then refuses it because the path goes on
      if (p.end) { if (i === els.length - 1) cmd.end = true; else n.role = 'end'; }
      if (f.cursor) link(f.cursor, n);
      f.cursor = n; lastEl = n;
    }
    // An end is refused while any branch still waits on its return: that branch could never rejoin. The
    // check runs after this line's own commands, so a return that closes the last waiting branch may end.
    const endHere = cmd.end;

    // A line on a path claims the oldest pending return aimed at that path, so no "meet" keyword is needed.
    const cand = pending.filter(p => !p.done && p.target === f).sort((a, b) => a.order - b.order)[0];
    if (cand) {
      const j = junction(f.lane);
      link(f.cursor, j); f.cursor = j;
      link(cand.last, j); cand.done = true;
    }

    let closedLane = null;
    // RETURN^N climbs N levels (Josue, 11/25): the floor is 1, and the ceiling is how far this path is from the main
    // path, since there is nothing above it. A number outside that is an error; it is drawn at the nearest limit.
    const depth = cmd.branch ? waiting.length : waiting.length - 1;
    if (cmd.ret && depth > 0 && (cmd.retN < 1 || cmd.retN > depth)) {
      errors.push(cmd.retN < 1
        ? `Line ${ln}: RETURN^${cmd.retN} is below the floor; the least is RETURN^1 (plain RETURN), one level up.`
        : `Line ${ln}: RETURN^${cmd.retN} goes past the main path: this path is ${depth} level${depth === 1 ? '' : 's'} from it, so the most is RETURN^${depth}.`);
      cmd.retN = Math.min(depth, Math.max(1, cmd.retN));
    }
    if (cmd.branch) {
      if (cmd.ret) { // closed branch: "wait" on the same line adds nothing, the return is pending anyway
        const target = waiting[Math.max(0, waiting.length - cmd.retN)];
        f.pend = { last: f.cursor, target, order: f.order, done: false, ln };
        pending.push(f.pend);
        f.state = 'pending'; closedLane = f.lane;
      } else if (cmd.wait) { waiting.push(f); f.state = 'waiting'; }
      else f.state = 'ended'; // plain branch terminates at its last element
    } else if (cmd.ret) {
      const idx = waiting.length - 1;
      if (idx === 0) warnings.push(`Line ${ln}: return on the main path ignored`);
      else {
        const target = waiting[Math.max(0, idx - cmd.retN)];
        f.pend = { last: f.cursor, target, order: f.order, done: false, ln };
        pending.push(f.pend);
        f.state = 'pending'; closedLane = f.lane;
        waiting.pop();
      }
    }
    if (endHere) {
      const open = waiting.slice(1);
      if (open.length) {
        const which = open.map(b => `line ${b.lines[0]}`).join(', ');
        errors.push(`Line ${ln}: end is not allowed while ${open.length === 1 ? 'a branch is' : open.length + ' branches are'} waiting on a return (${which}). Write the return first.`);
        lastEl.badEnd = true; badEnds.push(ln);
      } else lastEl.role = 'end';
    }
    info.set(ln, { lane: f.lane, before: top.lane, isBranch: cmd.branch, ret: cmd.ret, closedLane });
  }

  // Returns that found no line on their target path merge at the end of that path.
  const endJ = new Map();
  for (const p of pending.filter(p => !p.done)) {
    warnings.push(`Line ${p.ln}: return has no line on its target path to rejoin; merged at the end of that path`);
    let j = endJ.get(p.target);
    if (!j) {
      j = junction(p.target.lane);
      if (p.target.cursor) link(p.target.cursor, j);
      endJ.set(p.target, j);
    }
    link(p.last, j);
  }

  // An end block must be the last thing on its path (Josue, 11/24): it may close a branch that terminates,
  // but if anything is wired after it (more elements, a rejoin, a return) it is in the middle of a path.
  const out = new Set(edges.map(([a]) => a));
  for (const n of nodes) {
    if (n.role !== 'end' || !out.has(n.id)) continue;
    errors.push(`Line ${n.ln}: ${n.label} is marked end, but the path continues after it. An end must be the last element of its path.`);
    n.badEnd = true; delete n.role;
    if (!badEnds.includes(n.ln)) badEnds.push(n.ln);
  }

  // A decision needs two ways out, yes and no (Josue, 11/25). The no path is a branch, which leaves through the
  // junction placed right after the block, so the outputs are counted through that junction.
  const outs = new Map();
  for (const [a, b] of edges) (outs.get(a) || outs.set(a, []).get(a)).push(b);
  for (const n of nodes) {
    if (n.type !== 'el' || n.shape !== 'dec') continue;
    const next = outs.get(n.id) || [];
    const ways = next.reduce((k, b) => k + (nodes[b].type === 'junction' && nodes[b].decision ? (outs.get(b) || []).length : 1), 0);
    if (ways >= 2) continue;
    errors.push(`Line ${n.ln}: ${n.label} is a decision, so it needs two paths out of it, yes and no; it has ${ways === 0 ? 'none' : 'one'}. ${ways === 0 ? 'Continue the path after it and add a BRANCH for the no path.' : 'Add a BRANCH right after it for the no path.'}`);
    n.badEnd = true;
  }

  const branches = all.map(b => ({
    lane: b.lane, lines: b.lines, order: b.order, target: b.pend ? b.pend.target.lane : null,
    state: waiting.includes(b) ? 'waiting' : (b.pend && !b.pend.done ? 'pending' : (b.pend ? 'joined' : b.state)),
  }));
  // A diagram with a circuit part is a circuit. V7 (Josue, 11/25): nothing is grounded unless GND is written, so
  // there is no implied return wire any more; a circuit that needs ground says where.
  const circuit = nodes.some(n => n.type === 'el' && EE[n.shape]);
  const firstEl = nodes.find(n => n.type === 'el');
  const lastMain = endJ.get(main) || main.cursor;
  const model = {
    mode: 'v2', title, nodes, edges, lanes: laneCount, errors, warnings,
    levels, info, branches, waitingLanes: waiting.map(w => w.lane), badEnds,
    circuit, mainStart: firstEl ? firstEl.id : null, mainEnd: lastMain ? lastMain.id : null,
  };
  // The checks run for a circuit that is meant to be electrical (it has a GND or a MEAS); a plain drawing of parts
  // stays quiet. Solving needs a MEAS, and is skipped when a check found an error, since the numbers would mislead.
  const wantsMeas = nodes.some(n => n.meas);
  if (circuit && (wantsMeas || nodes.some(n => n.shape === 'GND'))) {
    const bad = checkCircuit(model);
    if (wantsMeas && !bad) model.sim = simulate(model);
  }
  return model;
}

// ---- Circuit solver (V6) ----------------------------------------------------------------------------------------
// Modified nodal analysis, the method circuit simulators use: one unknown per node voltage and one per current
// through a voltage-like part (VOLT_SRC, DEP_VOLT_SRC, AC_VOLT_SRC and IND). A DIODE is the Shockley diode, solved by
// Newton steps. Every node gets a tiny conductance to ground (GMIN, as SPICE does) so a dangling open branch still
// solves instead of making the matrix singular.
// AC (Josue, 11/24): each AC source carries its own omega, so the circuit is solved once per omega with only the
// sources at that omega switched on (the rest are zero: a voltage source a short, a current source open), plus
// once for DC, and the readings add by superposition. A solve at omega is in phasors: CAP is jωC, IND is jωL, which
// at omega 0 is exactly DC (CAP open, IND a short). The complex system is solved as a real one twice the size.
// Directions follow the drawing: current flows left to right through a part unless it is marked REV. A source's
// value is − to + along that direction. MEAS V reads + where the current enters, MEAS I reads along the arrow.
// A dependent source's value is gain * V(name) or gain * I(name) of another part, for example [2*V(R1)].
const GMIN = 1e-12;
// The diode (Josue, 11/25) is the textbook constant-drop model: DIODE = [FWD_VOLT, REV_VOLT]. On, it holds exactly
// FWD_VOLT (0.7 V unless given) from anode to cathode at any current; off, it is open; past REV_VOLT backwards it
// breaks down and holds that voltage the other way (a Zener). With no REV_VOLT it never breaks down, since a real
// part's breakdown ranges from about 5 V to 1000 V and any default would be a guess. A held voltage is stamped as a
// very large conductance, so the error is about a nanovolt per milliamp.
const DIODE_FWD = 0.7, DIODE_G = 1e6;
// FWD_VOLT and REV_VOLT from a diode's value: one number is FWD_VOLT, [fwd, rev] both, and an empty place keeps the
// default ([, 5.1]). null when a place holds something that is not a voltage.
function readDiode(raw) {
  if (raw == null || !String(raw).trim()) return { fwd: DIODE_FWD, rev: null };
  const parts = splitTop(String(raw), ',').map(x => x.trim());
  if (parts.length > 2) return null;
  const num = t => t === '' ? undefined : eeNumber('VS', t);
  const fwd = num(parts[0]), rev = num(parts[1] === undefined ? '' : parts[1]);
  if (fwd !== undefined && !(fwd >= 0)) return null;
  if (rev !== undefined && !(rev > 0)) return null;
  return { fwd: fwd === undefined ? DIODE_FWD : fwd, rev: rev === undefined ? null : rev };
}
// Readings below this are the method, not the circuit: GMIN leaks about 1e-12 times the voltage, so a few pA flow
// through an open capacitor. They show as 0.
const READ_FLOOR = 1e-10;
// Points that are wired together become one node; ground is the point G, which every GND element is. The parts keep
// their two node numbers (a is the left end, b the right; -1 is ground), shared by the checks and the solver.
function circuitGraph(model) {
  const { nodes, edges } = model;
  const els = nodes.filter(n => n.type === 'el');
  const parent = new Map();
  const find = a => { while (parent.has(a) && parent.get(a) !== a) a = parent.get(a); return a; };
  const union = (a, b) => { a = find(a); b = find(b); if (a !== b) parent.set(a, b); };
  const inPt = n => n.type === 'junction' ? 'J' + n.id : n.shape === 'GND' ? 'G' : 'L' + n.id;
  const outPt = n => n.type === 'junction' ? 'J' + n.id : n.shape === 'GND' ? 'G' : 'R' + n.id;
  for (const [a, b] of edges) union(outPt(nodes[a]), inPt(nodes[b]));
  // One GND is enough (Josue, 11/25): it joins both sides of the circuit, so the start of the main path and its last
  // point are both ground. Two or more GND are written out explicitly and tie nothing extra.
  const grounds = els.filter(n => n.shape === 'GND');
  const tied = [];
  // It only does so from an end of the path: a GND in the middle would put the parts on either side of it between
  // ground and ground, shorting them, so there it is just the reference point.
  if (grounds.length === 1 && model.mainStart != null && model.mainEnd != null) {
    const a = nodes[model.mainStart], b = nodes[model.mainEnd];
    if (a.shape === 'GND' && b.shape !== 'GND') { union(outPt(b), 'G'); tied.push('end'); }
    else if (b.shape === 'GND' && a.shape !== 'GND') { union(inPt(a), 'G'); tied.push('start'); }
  }
  model.tied = tied;
  const idx = new Map();
  const node = p => { const r = find(p); if (r === find('G')) return -1; if (!idx.has(r)) idx.set(r, idx.size); return idx.get(r); };
  const parts = els.filter(n => n.shape !== 'GND').map(n => ({ n, a: node(inPt(n)), b: node(outPt(n)) }));
  return { parts, N: idx.size, byName: new Map(parts.map(p => [p.n.label, p])), grounds };
}

// ---- Circuit checks (V7) ----------------------------------------------------------------------------------------
// Josue, 11/25: say what is wrong in words, with the line, instead of the solver's one generic failure or a quiet 0.
// Errors stop the solve and mark the parts with the red X the end rule uses (badEnd, kept off the badEnds list so the
// script highlight stays on end words); warnings still solve. Returns true when there was an error.
function checkCircuit(model) {
  const { nodes, errors, warnings } = model;
  // a mixed diagram is a drawing; simulate() names the flow block
  if (nodes.some(n => n.type === 'el' && !EE[n.shape])) return false;
  const { parts, N, grounds } = circuitGraph(model);
  const names = ps => ps.map(p => p.n.label).join(', ');
  let bad = false;
  const err = (ps, msg) => { bad = true; ps.forEach(p => { p.n.badEnd = true; }); errors.push(`Line ${ps[0].n.ln}: ${msg}`); };
  const warn = (ln, msg) => warnings.push(`Line ${ln}: ${msg}`);
  const G = N; // ground gets a slot of its own so it can sit in the same graph as the nodes
  const at = i => i < 0 ? G : i;

  // duplicate names make MEAS and V(R1) ambiguous
  const seen = new Map();
  for (const p of parts) {
    const first = seen.get(p.n.label);
    if (first) err([p], `${p.n.label} is already used on line ${first.n.ln}. MEAS and V(R1) need one part per name.`);
    else seen.set(p.n.label, p);
  }
  const meas = parts.filter(p => p.n.meas);
  if (!grounds.length && meas.length) err(meas.slice(0, 1), 'no GND. Write GND where 0 V is, for example *GND, R1, GND\\ , RES = 1k. A circuit with MEAS needs one.');

  // Which solves happen decides what an inductor is: a short in DC, an impedance in an AC-only circuit.
  const hasAC = parts.some(p => AC_TWIN[p.n.shape]);
  const dcSolve = !hasAC || parts.some(p => ['VS', 'IS', 'DVS', 'DIS'].includes(p.n.shape));
  // a loop made only of ideal voltage sources and shorts has no answer: the sources would have to agree exactly
  const vl = parts.filter(p => ['VS', 'DVS', 'VAC'].includes(p.n.shape) || (p.n.shape === 'L' && dcSolve));
  const adj = new Map(), nb = k => adj.get(k) || adj.set(k, []).get(k);
  for (const p of vl) {
    const a = at(p.a), b = at(p.b);
    // breadth-first search for a way from a to b through the voltage parts already seen
    const prev = new Map([[a, null]]), q = [a];
    while (q.length && !prev.has(b)) {
      const u = q.shift();
      for (const e of nb(u)) if (!prev.has(e.to)) { prev.set(e.to, { from: u, part: e.part }); q.push(e.to); }
    }
    if (prev.has(b)) {
      const loop = [p];
      for (let c = b; prev.get(c); c = prev.get(c).from) loop.push(prev.get(c).part);
      // a loop of inductors alone is not a fight between sources
      if (loop.some(x => x.n.shape !== 'L')) {
        loop.sort((x, y) => x.n.id - y.n.id);
        err(loop, loop.length === 1
          ? `${p.n.label} has both ends on the same node, so it is a source shorted by a wire.`
          : `${names(loop)} form a loop of only voltage sources and inductors, so their voltages cannot all hold. Add a resistor in the loop.`);
      }
    }
    nb(a).push({ to: b, part: p }); nb(b).push({ to: a, part: p });
  }

  // a node that touches only current sources has nowhere for the current to go
  const touch = new Map();
  for (const p of parts) for (const i of [p.a, p.b]) if (i >= 0) (touch.get(i) || touch.set(i, []).get(i)).push(p);
  const isI = p => ['IS', 'IAC', 'DIS'].includes(p.n.shape);
  for (const ps of touch.values()) if (ps.every(isI)) err(ps, `${names(ps)} ${ps.length === 1 ? 'has' : 'have'} a node that touches only current sources, so no current can flow. Connect a resistor or another path.`);
  // In DC a capacitor is open, so a current source that reaches a node only through capacitors pushes its current
  // nowhere; the solver would answer with a huge voltage (found building the all-words example, 11/25).
  // The DC current source must be the one stuck: an AC-only source sees the capacitor as an impedance.
    else if (dcSolve && ps.some(p => p.n.shape === 'IS' || p.n.shape === 'DIS') && ps.every(p => isI(p) || p.n.shape === 'C'))
      err(ps, `${names(ps)} meet at a node where a DC current source sees only capacitors, which are open in DC, so its current has nowhere to go. Add a resistor from that node to GND or another path.`);

  // connected groups: one reaches ground or it does not
  const up = new Map(), root = a => { while (up.has(a) && up.get(a) !== a) a = up.get(a); return a; };
  for (const p of parts) { const x = root(at(p.a)), y = root(at(p.b)); if (x !== y) up.set(x, y); }
  const gr = root(G);
  // A part on a dead-end branch carries no current: peel off parts whose far end touches nothing else, over and over,
  // and what is peeled is dead. Everything here is one connected drawing, so "no path to GND" in practice means "not on
  // a closed path"; a group that really is cut off from ground is caught by the root test.
  const deg = new Map([...touch].map(([k, v]) => [k, v.length])), dead = new Set();
  for (let again = true; again;) {
    again = false;
    for (const p of parts) {
      if (dead.has(p) || !((p.a >= 0 && deg.get(p.a) === 1) || (p.b >= 0 && deg.get(p.b) === 1))) continue;
      dead.add(p); again = true;
      for (const i of [p.a, p.b]) if (i >= 0) deg.set(i, deg.get(i) - 1);
    }
  }
  if (grounds.length) {
    for (const p of meas) if (root(at(p.a)) !== gr || dead.has(p)) err([p], `${p.n.label} is not on a closed path to GND (it ends in an open branch), so its MEAS would read 0 by accident. Connect it to GND or remove the MEAS.`);
    const lost = new Map();
    for (const p of parts) if (root(at(p.a)) !== gr && !p.n.badEnd) { const k = root(at(p.a)); (lost.get(k) || lost.set(k, []).get(k)).push(p); }
    for (const ps of lost.values()) warn(ps[0].n.ln, `${names(ps)} ${ps.length === 1 ? 'is' : 'are'} not connected to GND; drawn but not solved.`);
  }
  // shorted parts and open ends
  for (const p of parts) {
    if (p.a === p.b) { if (!p.n.badEnd) warn(p.n.ln, `both ends of ${p.n.label} are the same node, so it reads 0 V and 0 A.`); continue; }
    // only on the part's own group: a whole group with no ground is already reported as floating
    if (!grounds.length || root(at(p.a)) !== gr || p.n.badEnd) continue;
    for (const [i, side] of [[p.a, 'left'], [p.b, 'right']]) if (i >= 0 && touch.get(i).length === 1) warn(p.n.ln, `the ${side} end of ${p.n.label} is open: nothing is connected there, so nothing flows through it.`);
  }
  // two GND points is the normal closed loop (one at each end); more than that is worth a note
  if (grounds.length > 2) warn(grounds[2].ln, `GND appears ${grounds.length} times; all of them are one ground, so these points are wired together.`);
  return bad;
}

function simulate(model) {
  const { nodes, edges, warnings } = model;
  const els = nodes.filter(n => n.type === 'el');
  const stop = why => { warnings.push('Not simulated: ' + why); return { ok: false, why }; };
  const flow = els.find(n => !EE[n.shape]);
  if (flow) return stop(`${flow.label} is a flow block, and a circuit can only hold circuit parts.`);

  const { parts, N, byName } = circuitGraph(model);

  // AC sources first: their omegas say which solves are needed, and whether CAP and IND need values.
  const omegas = [];
  for (const p of parts.filter(p => AC_TWIN[p.n.shape])) {
    p.ac = readAC(p.n.shape, p.n.raw);
    if (!p.ac) return stop(`${p.n.label} needs an AC value: amplitude, omega and angle, as 5 cos(377t + 30) or [5, 377, 30].`);
    if (!(p.ac.w > 0)) return stop(`${p.n.label} has omega ${p.ac.w}; an AC source needs omega above 0 (a steady value is a ${CODE_WORDS[AC_TWIN[p.n.shape]]}).`);
    if (!omegas.includes(p.ac.w)) omegas.push(p.ac.w);
  }
  const hasAC = omegas.length > 0;
  const diodes = parts.filter(p => p.n.shape === 'D');
  // a diode bends the waveform, so phasors (one sinusoid per omega) no longer describe it
  if (hasAC && diodes.length) return stop(`${diodes[0].n.label} is a diode in a circuit with AC sources; that needs a time simulation, which comes in a later version.`);

  // Values, and the voltage-like parts that need a current unknown.
  let m = 0;
  for (const p of parts) {
    const s = p.n.shape;
    if (s === 'VS' || s === 'DVS' || s === 'L' || s === 'VAC') p.k = m++;
    if (s === 'D') {
      p.dio = readDiode(p.n.raw);
      if (!p.dio) return stop(`${p.n.label} needs DIODE = FWD_VOLT or [FWD_VOLT, REV_VOLT], numbers in volts with REV_VOLT above 0, for example [0.7, 5.1] (it has "${p.n.raw}").`);
      continue;
    }
    if (AC_TWIN[s]) continue;
    if ((s === 'C' || s === 'L') && !hasAC) continue; // open and short in DC, whatever their value
    if (s === 'DVS' || s === 'DIS') { p.ctrl = readControl(p.n.raw, s); if (!p.ctrl) return stop(`${p.n.label} needs a value: a number or gain*V(name) or gain*I(name), for example [2*V(R1)].`); continue; }
    p.val = eeNumber(s, p.n.raw);
    if (!isFinite(p.val)) return stop(`${p.n.label} needs a number as its value (it has ${p.n.raw == null ? 'none' : '"' + p.n.raw + '"'}).`);
    if (s === 'R' && p.val === 0) return stop(`${p.n.label} is 0 Ω; use a wire or a tiny value.`);
    if ((s === 'C' || s === 'L') && !(p.val > 0)) return stop(`${p.n.label} needs a value above 0 in a circuit with AC sources.`);
  }
  // An AC source's phasor at omega w: its value when w is its own omega, zero otherwise (superposition).
  const phasorAt = (p, w) => p.ac.w === w ? [p.ac.amp * Math.cos(p.ac.ph * Math.PI / 180), p.ac.amp * Math.sin(p.ac.ph * Math.PI / 180)] : [0, 0];
  // A reading V or I of part p at omega w, read the way MEAS reads it, as complex weights on the unknowns plus a
  // constant: reading = Σ w·x + c. It also steers dependent sources.
  const reading = (p, q, w) => {
    const sg = p.n.rev ? -1 : 1, wt = new Map();
    const add = (j, re, im) => { if (j < 0) return; const o = wt.get(j) || [0, 0]; wt.set(j, [o[0] + re, o[1] + im]); };
    if (q === 'V') { add(p.a, sg, 0); add(p.b, -sg, 0); return { w: wt, c: [0, 0] }; }
    const s = p.n.shape;
    if (s === 'R') { add(p.a, sg / p.val, 0); add(p.b, -sg / p.val, 0); return { w: wt, c: [0, 0] }; }
    if (s === 'C') { if (w) { add(p.a, 0, sg * w * p.val); add(p.b, 0, -sg * w * p.val); } return { w: wt, c: [0, 0] }; }
    if (s === 'IS') return { w: wt, c: [w === 0 ? p.val : 0, 0] }; // along its own arrow it is just its value
    if (s === 'IAC') return { w: wt, c: phasorAt(p, w) };
    if (p.k !== undefined) { add(N + p.k, sg * (s === 'L' ? 1 : (p.n.rev ? 1 : -1)), 0); return { w: wt, c: [0, 0] }; }
    return null; // a diode's current is not linear, so it cannot steer a dependent source here
  };
  for (const p of parts.filter(p => p.ctrl && p.ctrl.ref)) {
    const t = byName.get(p.ctrl.ref);
    if (!t) return stop(`${p.n.label} refers to ${p.ctrl.ref}, which is not a part in this circuit.`);
    if (t.n.shape === 'DVS' || t.n.shape === 'DIS') return stop(`${p.n.label} refers to another dependent source, which is not supported yet.`);
    if (!reading(t, p.ctrl.q, 0)) return stop(`${p.n.label} cannot follow the current of the diode ${t.n.label}.`);
    p.t = t;
  }

  // DC is solved when something drives it (a DC source, or a dependent source with a fixed number) or when there is
  // nothing else to solve; each AC omega is solved once.
  const dcDriven = parts.some(p => p.n.shape === 'VS' || p.n.shape === 'IS' || (p.ctrl && !p.ctrl.ref));
  const solves = [...(dcDriven || !hasAC ? [0] : []), ...omegas];
  const S = N + m, T = 2 * S;
  function diodeLine(p, state) {
    if (state === 'on') return [DIODE_G, -DIODE_G * p.dio.fwd];
    if (state === 'rev') return [DIODE_G, DIODE_G * p.dio.rev];
    return [GMIN, 0];
  }
  function diodeV(p, x) {
    const lo = p.n.rev ? p.b : p.a, hi = p.n.rev ? p.a : p.b;
    return (lo >= 0 ? x[lo] : 0) - (hi >= 0 ? x[hi] : 0);
  }
  let lastStates = null;
  const solveAt = w => {
    // each diode is on, off or broken down ('rev'); start them all on and correct the ones the answer contradicts
    const st = new Map(diodes.map(p => [p, 'on']));
    let x = null;
    for (let it = 0; it < 200; it++) {
      // the unknowns are [real parts, imaginary parts]; a complex entry a + jb fills four places
      const A = Array.from({ length: T }, () => new Float64Array(T)), z = new Float64Array(T);
      const put = (r, c, re, im) => {
        if (r < 0 || c < 0) return;
        A[r][c] += re; A[S + r][S + c] += re;
        if (im) { A[r][S + c] -= im; A[S + r][c] += im; }
      };
      const rhs = (r, re, im) => { if (r >= 0) { z[r] += re; z[S + r] += im; } };
      const y = (a, b, re, im) => { put(a, a, re, im); put(b, b, re, im); put(a, b, -re, -im); put(b, a, -re, -im); };
      for (let i = 0; i < N; i++) put(i, i, GMIN, 0);
      for (const p of parts) {
        const s = p.n.shape, rev = p.n.rev;
        const lo = rev ? p.b : p.a, hi = rev ? p.a : p.b; // along the part's direction: current goes lo to hi
        const g = p.ctrl && p.ctrl.gain, lin = p.t ? reading(p.t, p.ctrl.q, w) : null;
        if (s === 'R') y(p.a, p.b, 1 / p.val, 0);
        else if (s === 'C') { if (w) y(p.a, p.b, 0, w * p.val); }
        else if (s === 'VS' || s === 'DVS' || s === 'L' || s === 'VAC') {
          // the current unknown enters the + end; + is hi for a source (− to + along the path), a for an inductor
          const pl = s === 'L' ? p.a : hi, mi = s === 'L' ? p.b : lo, k = N + p.k;
          put(pl, k, 1, 0); put(k, pl, 1, 0); put(mi, k, -1, 0); put(k, mi, -1, 0);
          if (s === 'L' && w) put(k, k, 0, -w * p.val); // V(a) − V(b) = jωL·I
          if (s === 'VS' && w === 0) rhs(k, p.val, 0);
          if (s === 'VAC') rhs(k, ...phasorAt(p, w));
          if (s === 'DVS') {
            if (lin) { for (const [j, [re, im]] of lin.w) put(k, j, -g * re, -g * im); rhs(k, g * lin.c[0], g * lin.c[1]); }
            else if (w === 0) rhs(k, g, 0);
          }
        } else if (s === 'IS' || s === 'DIS' || s === 'IAC') {
          // the source pushes its current out at hi and draws it in at lo
          let c = [0, 0];
          if (s === 'IS') c = [w === 0 ? p.val : 0, 0];
          else if (s === 'IAC') c = phasorAt(p, w);
          else if (lin) {
            for (const [j, [re, im]] of lin.w) { put(hi, j, -g * re, -g * im); put(lo, j, g * re, g * im); }
            c = [g * lin.c[0], g * lin.c[1]];
          } else if (w === 0) c = [g, 0];
          rhs(hi, c[0], c[1]); rhs(lo, -c[0], -c[1]);
        } else if (s === 'D') {
          // anode is lo, cathode hi. The current anode to cathode is I = g·(v − hold): on holds +FWD, broken down
          // holds −REV, off is open (only GMIN, hold 0).
          const [gd, ieq] = diodeLine(p, st.get(p));
          y(lo, hi, gd, 0);
          rhs(lo, -ieq, 0); rhs(hi, ieq, 0);
        }
      }
      x = solveLinear(A, z);
      if (!x) return null;
      if (!diodes.length) break;
      // A state is wrong when its own answer contradicts it: on with current flowing backwards, broken down with
      // current flowing forwards, or off with the voltage past FWD or past −REV. Small margins keep a diode sitting
      // right at its threshold from flipping back and forth.
      let changed = false;
      for (const p of diodes) {
        const v = diodeV(p, x), cur = st.get(p), [gd, ieq] = diodeLine(p, cur), i = gd * v + ieq;
        let next = cur;
        if (cur === 'on' && i < -1e-12) next = 'off';
        else if (cur === 'rev' && i > 1e-12) next = 'off';
        else if (cur === 'off' && v > p.dio.fwd + 1e-9) next = 'on';
        else if (cur === 'off' && p.dio.rev !== null && v < -p.dio.rev - 1e-9) next = 'rev';
        if (next !== cur) { st.set(p, next); changed = true; }
      }
      if (!changed) break;
      if (it === 199) return 'diodes';
    }
    lastStates = st;
    return x;
  };

  // Readings for every MEAS marker: one term per solve, added up by superposition.
  // (diodeLine and diodeV are hoisted from below so solveAt and the readings share them.)
  const terms = new Map(parts.filter(p => p.n.meas).map(p => [p, []]));
  for (const w of solves) {
    const x = solveAt(w);
    if (x === 'diodes') return stop('the diodes did not settle (no convergence after 200 steps).');
    if (!x) return stop('the circuit cannot be solved: look for a loop made only of voltage sources and inductors, or two sources fighting.');
    for (const [p, list] of terms) {
      let re, im = 0;
      if (p.n.shape === 'D') {
        const v = diodeV(p, x), [gd, ieq] = diodeLine(p, lastStates.get(p));
        re = p.n.meas === 'V' ? v : gd * v + ieq;
      } else {
        const r = reading(p, p.n.meas, w);
        [re, im] = r.c;
        for (const [j, [wr, wi]] of r.w) { re += wr * x[j] - wi * x[S + j]; im += wr * x[S + j] + wi * x[j]; }
      }
      list.push({ w, re: Math.abs(re) < READ_FLOOR ? 0 : re, im: Math.abs(im) < READ_FLOOR ? 0 : im });
    }
  }
  const results = [];
  for (const [p, list] of terms) {
    const unit = p.n.meas === 'V' ? 'V' : 'A', dc = list.find(t => t.w === 0);
    p.n.measNum = dc ? dc.re : 0;
    p.n.measAC = list.filter(t => t.w > 0).map(t => ({ w: t.w, re: t.re, im: t.im }));
    p.n.measValue = fmtReading(list, unit, p.n.measForm || 'polar');
    // the reading sits between + and − (or after the arrow), so the part widens to keep them apart
    p.n.w = Math.max(p.n.w, Math.round(p.n.measValue.length * 7 + 40));
    results.push([p.n.label, p.n.meas, p.n.measNum, ...p.n.measAC.map(t => [t.w, t.re, t.im])]);
  }
  return { ok: true, results, nodes: N, omegas: solves };
}

// A reading made of a DC term and one phasor per omega, written as their sum. A DC-only reading is a plain number
// whatever the AC form. With several terms in polar or rectangular form each phasor names its omega, because
// phasors at different omegas cannot be added into one; the sinusoidal form names it already.
function fmtReading(list, unit, form) {
  const dc = list.find(t => t.w === 0), ac = list.filter(t => t.w > 0 && (t.re || t.im));
  if (!ac.length) return fmtEng(dc ? dc.re : 0, unit);
  const out = dc && dc.re ? [fmtEng(dc.re, unit)] : [];
  const tag = out.length + ac.length > 1 && form !== 'sinusoidal';
  // a rectangular phasor has its own + or −, so in a sum it is bracketed to read as one term
  const wrap = s => tag && form === 'rectangular' ? `(${s})` : s;
  for (const t of ac) out.push(wrap(formatPhasor(t.re, t.im, unit, form, t.w)) + (tag ? ` @ ${+t.w.toPrecision(6)} rad/s` : ''));
  return out.join(' + ');
}

// gain*V(name), V(name)*gain, gain*I(name), or a plain number (then a fixed value). Brackets are optional here.
function readControl(raw, kind) {
  if (raw == null) return null;
  const s = String(raw).trim().replace(/^\[|\]$/g, '').trim();
  const num = '([+-]?(?:\\d+(?:\\.\\d*)?|\\.\\d+)(?:e[+-]?\\d+)?)';
  const m = s.match(new RegExp('^(?:' + num + '\\s*\\*\\s*)?([VI])\\s*\\(\\s*([^)]+?)\\s*\\)(?:\\s*\\*\\s*' + num + ')?$'));
  if (m) return { gain: (m[1] ? +m[1] : 1) * (m[4] ? +m[4] : 1), q: m[2], ref: m[3] };
  const v = eeNumber(kind, s);
  return isFinite(v) ? { gain: v } : null;
}

// Gaussian elimination with partial pivoting; null when the matrix is singular.
function solveLinear(A, z) {
  const n = z.length, M = A.map((r, i) => { const row = Array.from(r); row.push(z[i]); return row; });
  for (let c = 0; c < n; c++) {
    let piv = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
    if (Math.abs(M[piv][c]) < 1e-18) return null;
    [M[c], M[piv]] = [M[piv], M[c]];
    for (let r = c + 1; r < n; r++) {
      const f = M[r][c] / M[c][c];
      if (f) for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
    }
  }
  const x = new Array(n).fill(0);
  for (let r = n - 1; r >= 0; r--) {
    let s = M[r][n];
    for (let k = r + 1; k < n; k++) s -= M[r][k] * x[k];
    x[r] = s / M[r][r];
  }
  return x;
}

// Where the end command sits in a line (the word or its letter), so the editor can mark it in red.
function endWordRange(raw) {
  const cs = specifierStart(raw);
  const w = cs < 0 ? null : raw.slice(cs).match(/(^|[^\w^])(end)(?![\w^])/i);
  if (!w) return null;
  const from = cs + w.index + w[1].length;
  return { from, to: from + w[2].length };
}

// Strength per lane for the branches that are still waiting on a return. The text is cut at the caret
// line, so what is highlighted matches what has been typed so far. Lane numbers come from the order
// branches open, so they are the same in the cut text and in the whole text.
function highlightAt(src, caretLn) {
  const out = { lanes: new Map(), lines: new Map(), wait: null };
  const all = src.split(/\r?\n/);
  const m = parse(all.slice(0, caretLn).join('\n'), { partial: true });
  // m0 is the text above the caret line: what is still unresolved before this line is typed. A line on a
  // path resolves the oldest-created pending return aimed at that path, so that is the one shown strongest.
  const m0 = parse(all.slice(0, caretLn - 1).join('\n'), { partial: true });
  const open = b => b.state === 'waiting' || b.state === 'pending';
  for (const b of m0.branches) if (open(b)) out.lanes.set(b.lane, 'weak');
  for (const b of m.branches) if (open(b)) out.lanes.set(b.lane, 'weak');
  const cur = m.info.get(caretLn);
  const top0 = m0.waitingLanes[m0.waitingLanes.length - 1];
  const due = (cur && cur.isBranch) ? null
    : m0.branches.filter(b => b.state === 'pending' && b.target === top0).sort((a, b) => a.order - b.order)[0];
  // Without a rejoin due, fall back to the open branch the line continues; once "return" is on the line
  // it narrows to the branch that return closes (or, on a branch line, the new branch).
  const strong = due ? due.lane
    : cur ? (cur.ret ? (cur.isBranch ? cur.lane : cur.before) : cur.before) : top0;
  if (strong > 0 && out.lanes.has(strong)) out.lanes.set(strong, 'strong');
  for (const b of m.branches.concat(m0.branches)) {
    const s = out.lanes.get(b.lane);
    if (!s) continue;
    for (const ln of b.lines) if (s === 'strong' || !out.lines.has(ln)) out.lines.set(ln, s);
  }
  // Red bubble on the "wait" of the innermost open branch, but only while the caret line sits on that
  // branch's own level. A branch line is one level deeper, so branching off from inside it shows nothing,
  // and once "return" is on the line the branch is no longer waiting, so the bubble clears.
  out.wait = null;
  const top = cur ? cur.before : m.waitingLanes[m.waitingLanes.length - 1];
  const nested = !!(cur && cur.isBranch);
  const wb = m.branches.find(b => b.lane === top);
  if (top > 0 && !nested && wb && wb.state === 'waiting') {
    const ln = wb.lines[0], raw = src.split(/\r?\n/)[ln - 1];
    const cs = specifierStart(raw);
    // the word in any case, the letter only lower case (single letters are case-sensitive)
    const w = cs < 0 ? null : raw.slice(cs).match(/(^|[^\w^])([Ww][Aa][Ii][Tt]|w)(?![\w^])/);
    if (w) { const from = cs + w.index + w[1].length; out.wait = { ln, from, to: from + w[2].length }; }
  }
  return out;
}

// Index where the command part of a line starts (just after the closing delimiter), or -1.
function specifierStart(raw) {
  const m = raw.match(/^\s*\*\s*[^\\]*?\s*\\\s*(.*)$/);
  return m ? raw.length - m[1].length : -1;
}

// "return2" becomes "return^2" in the command part of a line; the caret moves with the text.
function convertReturnDigits(text, caret) {
  const lines = text.split('\n');
  let pos = 0, shift = 0;
  const done = lines.map(raw => {
    const start = pos; pos += raw.length + 1;
    const m = raw.match(/^\s*\*\s*[^\\]*?\s*\\\s*(.*)$/);
    if (!m) return raw;
    const cut = raw.length - m[1].length;
    let rest = m[1], added = 0;
    rest = rest.replace(/\breturn(\d+)/gi, (all, d, at) => {
      if (start + cut + at + 6 <= caret) added++;
      return 'return^' + d;
    });
    shift += added;
    return raw.slice(0, cut) + rest;
  });
  return { text: done.join('\n'), caret: caret + shift };
}

// Everything can be typed on one line: an asterisk that opens a new element list (one that comes after a
// closed list on the same line) starts a new line. An asterisk inside an open list is left alone.
function splitSequences(text, caret) {
  let pos = 0, shift = 0, cc = caret;
  const out = text.split('\n').map(raw => {
    const start = pos; pos += raw.length + 1;
    let inList = false, seen = false, depth = 0;
    const cuts = [];
    for (let k = 0; k < raw.length; k++) {
      // an asterisk inside a bracketed value is part of the value, not a new line
      if (!inList && raw[k] === '[') depth++;
      else if (!inList && raw[k] === ']' && depth > 0) depth--;
      else if (!inList && depth === 0 && raw[k] === '*') { if (seen) cuts.push(k); inList = true; seen = true; }
      else if (inList && raw[k] === '\\') inList = false;
    }
    if (!cuts.length) return raw;
    let res = '', last = 0;
    for (const k of cuts) {
      const seg = raw.slice(last, k), kept = seg.replace(/\s+$/, ''), removed = seg.length - kept.length;
      const a = start + k;
      if (cc > a - removed && cc < a) cc = a; // a caret in the dropped spaces lands on the new line
      if (cc >= a) shift += 1 - removed;
      res += kept + '\n'; last = k;
    }
    return res + raw.slice(last);
  });
  return { text: out.join('\n'), caret: cc + shift };
}

// Indentation is derived from the commands (three spaces per level) and typed spaces are discarded.
function reindentWithCaret(text, caret) {
  const m = parse(text, { partial: true });
  const lines = text.split('\n');
  let pos = 0, delta = 0, newCaret = caret;
  const out = lines.map((raw, i) => {
    const start = pos; pos += raw.length + 1;
    const onCaret = caret >= start && caret <= start + raw.length;
    let level = m.levels.get(i + 1);
    if (level === undefined) {
      // A fresh blank line under the caret starts at the level a plain line would have there, so the
      // first character typed already sits in the right place.
      // (a line holding only the opening asterisk counts as blank: nothing typed after it yet)
      if (!(onCaret && (!raw.trim() || /^\s*\*\s*$/.test(raw)) && i > 0)) return raw;
      level = Math.max(0, parse(lines.slice(0, i).join('\n'), { partial: true }).waitingLanes.length - 1);
    }
    const oldInd = raw.length - raw.trimStart().length;
    const ind = ' '.repeat(3 * level);
    if (onCaret) {
      // caret keeps its place inside the line's content, after the shift from every earlier line
      newCaret = Math.max(caret + delta + ind.length - oldInd, start + delta + ind.length);
    }
    delta += ind.length - oldInd;
    return ind + raw.trimStart();
  });
  // a caret past the last indented line only shifts by the total change
  if (caret > pos - 1) newCaret = caret + delta;
  return { text: out.join('\n'), caret: Math.max(0, newCaret) };
}

// Waits still open once the text through the caret line is read, outermost first. The last one is the
// innermost: the one the next plain line continues and the next "return" closes.
function openWaits(src, caretLn) {
  const all = src.split(/\r?\n/);
  const m = parse(all.slice(0, caretLn).join('\n'), { partial: true });
  const open = m.branches.filter(b => b.state === 'waiting');
  return open.map((b, i) => {
    const body = (all[b.lines[0] - 1].match(/^\s*\*\s*([^\\]*?)\s*\\/) || [, ''])[1];
    return { ln: b.lines[0], text: body, innermost: i === open.length - 1 };
  });
}

// Result shape shared by the three box helpers: new text, caret offset, the line the caret is on (1-based),
// that line without its tabs (what the box shows) and the caret offset inside it.
function lineResult(t, c) {
  const ln = t.slice(0, c).split('\n').length;
  const ls = t.lastIndexOf('\n', c - 1) + 1;
  const end = t.indexOf('\n', ls), raw = t.slice(ls, end < 0 ? undefined : end);
  const ind = raw.length - raw.trimStart().length;
  return { text: t, caret: c, ln, line: raw.trimStart(), barCaret: Math.max(0, c - ls - ind) };
}

// The bottom box edits one script line. This puts the box's text into line caretLn, then runs the same
// clean-up as the script editor (return2, one-line splitting, tabbing).
function barEdit(text, caretLn, value, valueCaret) {
  const lines = text.split('\n');
  while (lines.length < caretLn) lines.push('');
  lines[caretLn - 1] = value;
  let t = lines.join('\n');
  let c = lines.slice(0, caretLn - 1).join('\n').length + (caretLn > 1 ? 1 : 0) + (valueCaret == null ? value.length : valueCaret);
  let r = convertReturnDigits(t, c); t = r.text; c = r.caret;
  r = splitSequences(t, c); t = r.text; c = r.caret;
  r = reindentWithCaret(t, c);
  return lineResult(r.text, r.caret);
}

// Enter in the box: a new line under the current one, tabbed to the level a plain line has there.
function barEnter(text, caretLn) {
  const lines = text.split('\n');
  lines.splice(caretLn, 0, '');
  const r = reindentWithCaret(lines.join('\n'), lines.slice(0, caretLn).join('\n').length + 1);
  return lineResult(r.text, r.caret);
}

// Backspace in an empty box: drop that empty line and go back to the end of the one above.
function barBack(text, caretLn) {
  if (caretLn < 2) return null;
  const lines = text.split('\n');
  lines.splice(caretLn - 1, 1);
  return lineResult(lines.join('\n'), lines.slice(0, caretLn - 1).join('\n').length);
}

// Enter does the hotkey's job (Josue, 11/24): on a line whose element list is still open it types the closing \
// (with a space, so a shorthand letter typed next is written out as usual); on a line that is closed it ends the
// line and starts the next one with its opening * already typed. A name line has nothing after its \, so Enter
// closes it and starts the next line at once; a bare * closes the diagram (*\), after which Enter is a plain line
// break. A shorthand letter left at the end of the line is written out first, as Enter always did. Returns the
// tidied text and caret (lineResult form), or null when Enter should just break the line: in the middle of a line,
// inside an open [ ] value, or after the diagram is closed. Shift+Enter is always a plain line break (editor code).
function enterAt(text, caret) {
  // the letter before the caret is written out as if a line break had been typed, and that line break taken back
  const x = expandAtCaret(text.slice(0, caret) + '\n' + text.slice(caret), caret + 1);
  if (x) { text = x.text.slice(0, x.caret - 1) + x.text.slice(x.caret); caret = x.caret - 1; }
  const ls = text.lastIndexOf('\n', caret - 1) + 1, nl = text.indexOf('\n', caret), le = nl < 0 ? text.length : nl;
  if (text.slice(caret, le).trim()) return null;
  const before = text.slice(ls, caret).replace(/\s+$/, ''), cut = ls + before.length;
  const at = s => { const t = text.slice(0, cut) + s + text.slice(le), c = cut + s.length; return tidy(t, c); };
  const tidy = (t, c) => {
    let r = convertReturnDigits(t, c); r = splitSequences(r.text, r.caret); r = reindentWithCaret(r.text, r.caret);
    return lineResult(r.text, r.caret);
  };
  const firstLine = !text.slice(0, ls).trim();
  // nothing may follow a closed diagram, so the last *\ and anything under it take plain line breaks
  if (/(^|\n)\s*\*\s*\\\s*(\n|$)/.test(text.slice(0, ls))) return null;
  if (!before.trim()) return at(before + '*');
  const open = before.match(/^\s*\*([^\\]*)$/);
  if (open) {
    if (firstLine) return at('\\\n*');             // the name line: close it and go on
    if (!open[1].trim()) return at('\\');           // a bare *: this closes the diagram
    if (/,$/.test(before)) { const t = text.slice(0, cut - 1) + '\\ ' + text.slice(le); return tidy(t, cut + 1); } // the comma a space typed
    return at('\\ ');                               // an element list: on to its specifier
  }
  if (/^\s*\*\s*\\$/.test(before)) return null;     // the closing *\ itself
  if (!before.includes('\\')) return null;
  // In the specifier (Josue, 11/25): Enter at the start of an entry (right after the backslash, or after a comma)
  // opens a bracket for that element; inside a bracket it closes it with "], " ready for the next element; right
  // after that, the dangling comma goes and the next line starts. After a word that is not in a bracket it still
  // starts the next line.
  const spec = before.slice(before.indexOf('\\') + 1);
  // Enter right after = does nothing until something is typed after it (Josue, 11/25); anything will do
  if (/=$/.test(spec)) return lineResult(text, caret);
  // Enter right after a word that expects a value types " = " for it
  const vw = spec.match(/(^|[\s,;[])([A-Za-z_]+)$/);
  if (vw && takesValue(vw[2]) && inSpecifier(text.slice(ls, cut - vw[2].length))) return at(' = ');
  let depth = 0;
  for (const ch of spec) { if (ch === '[') depth++; else if (ch === ']' && depth > 0) depth--; }
  if (depth > 0) return at(']'.repeat(depth) + ', ');
  if (/\],$/.test(spec)) { const t = text.slice(0, cut - 1) + '\n*' + text.slice(le); return tidy(t, cut + 1); }
  if (!spec.trim() || /,$/.test(spec)) return at(' [');
  return at('\n*');
}

const CFG = { H: 44, GAP: 46, LANE: 84, TOP: 78, LEFT: 36 };

// The layout works in flow coordinates, p along the path and q across it (one lane per branch level), and maps
// them to the page by direction (V6, Josue 11/24): left to right puts p on x, top-down puts p on y. Blocks stay
// upright either way, so in top-down a block spans its height along the path; a circuit part is turned to run down
// the page and keeps its length, and its texts move beside it. ext is half of what an element spans along the path,
// which is where the wires meet it.
function layout(model) {
  const { nodes, edges } = model, td = SETTINGS.direction === 'td';
  model.td = td;
  const inc = nodes.map(() => []);
  edges.forEach(([a, b]) => inc[b].push(a));
  const layer = nodes.map(() => 0);
  nodes.forEach((n, i) => { layer[i] = inc[i].length ? Math.max(...inc[i].map(a => layer[a])) + 1 : 0; });
  const nLayers = Math.max(0, ...layer) + 1;
  nodes.forEach(n => { n.ext = (td && n.type === 'el' && !EE[n.shape] ? CFG.H : n.w) / 2; });
  const colW = new Array(nLayers).fill(0);
  nodes.forEach((n, i) => { colW[layer[i]] = Math.max(colW[layer[i]], 2 * n.ext); });
  const colP = []; let cum = td ? 64 : CFG.LEFT;
  for (let l = 0; l < nLayers; l++) { colP[l] = cum + colW[l] / 2; cum += colW[l] + CFG.GAP; }
  if (!td) {
    // a MEAS marker sits above a part's name, so the top row moves down to keep it clear of the title
    const markTop = nodes.some(n => n.meas && n.lane === 0) ? 28 : 0;
    const top = CFG.TOP + markTop;
    nodes.forEach((n, i) => { n.p = colP[layer[i]]; n.q = top + n.lane * CFG.LANE; });
    model.width = Math.max(360, cum - CFG.GAP + CFG.LEFT);
    const bottom = top + (model.lanes - 1) * CFG.LANE;
    model.height = bottom + CFG.H / 2 + 40;
  } else {
    // how far each element reaches either side of its lane: a block half its width; a part its marker on the left
    // and its name and value on the right
    const side = n => {
      if (n.type === 'junction') return [5, 5];
      if (!EE[n.shape]) return [n.w / 2, n.w / 2];
      return [n.meas ? (n.measValue || n.meas).length * 7 + 34 : 16,
        22 + Math.max(SHOW_EE_NAME ? n.label.length * 8 : 0, n.value ? n.value.length * 7.5 : 0)];
    };
    const sides = nodes.map(side);
    const L = Math.max(16, ...sides.map(x => x[0])), R = Math.max(16, ...sides.map(x => x[1]));
    // one pitch for every lane, so branch wires stay straight
    const pitch = Math.max(CFG.LANE, L + R + 30), left = CFG.LEFT + L;
    nodes.forEach((n, i) => { n.p = colP[layer[i]]; n.q = left + n.lane * pitch; });
    const last = left + (model.lanes - 1) * pitch;
    model.width = Math.max(360, last + R + 30);
    model.height = cum - CFG.GAP + 40;
  }
  nodes.forEach(n => { n.x = td ? n.q : n.p; n.y = td ? n.p : n.q; });
  // whole pixels: text widths are estimates in fractions, and the zoom code reads the page size as an integer
  model.width = Math.ceil(model.width); model.height = Math.ceil(model.height);
  return model;
}

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Black by default (Josue, 11/24): parts, blocks, labels, wires and junctions, the way a schematic is printed.
// A color word still tints one element. START_FILL is a neutral gray so the start and end shapes stay distinct
// without a blue tint against the black outlines.
const INK = '#111111';
const START_FILL = '#f1f3f5';
const BAD = '#e5383b'; // same red as the wait bubble in the script, so the two read as one kind of warning
const HL = { strong: { stroke: '#d9480f', fill: '#ffe8d9', w: 3 }, weak: { stroke: '#d98a1f', fill: '#fff4e0', w: 2.5 } };

function labelSVG(label, x, y, ink, size) {
  const m = label.match(/^([^_]*)_(.+)$/);
  const fs = size || 17, sub = Math.round(fs * 0.7);
  const inner = m ? `${esc(m[1])}<tspan dy="${Math.round(fs * 0.3)}" font-size="${sub}">${esc(m[2])}</tspan>` : esc(label);
  return `<text x="${x}" y="${y + Math.round(fs * 0.3)}" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="${fs}" fill="${ink || INK}">${inner}</text>`;
}
// Values are free text, so they are drawn as typed: no subscript reading of "_".
function valueSVG(value, x, y, ink) {
  return `<text x="${x}" y="${y + 5}" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="14" fill="${ink || INK}">${esc(value)}</text>`;
}
const smallText = (t, x, y, anchor) => `<text x="${x}" y="${y}" text-anchor="${anchor || 'start'}" font-family="system-ui, Segoe UI, sans-serif" font-size="11" fill="#555">${esc(t)}</text>`;

function shapeSVG(kind, x0, y0, w, h, fill, stroke, sw) {
  const a = `fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"`;
  const poly = pts => `<polygon points="${pts.map(p => p.join(',')).join(' ')}" ${a}/>`;
  if (kind === 'pill') return `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="${h / 2}" ${a}/>`;
  if (kind === 'flag') return poly([[x0, y0], [x0 + w, y0], [x0 + w, y0 + h - 14], [x0 + w - 14, y0 + h], [x0, y0 + h]]);
  if (kind === 'tri') return poly([[x0, y0], [x0, y0 + h], [x0 + w, y0 + h / 2]]);
  if (kind === 'circ') return `<ellipse cx="${x0 + w / 2}" cy="${y0 + h / 2}" rx="${w / 2}" ry="${h / 2}" ${a}/>`;
  if (kind === 'dia') return poly([[x0 + w / 2, y0], [x0 + w, y0 + h / 2], [x0 + w / 2, y0 + h], [x0, y0 + h / 2]]);
  // io: slanted sides, but the wires still meet the left and right middle, which lie on the slants
  if (kind === 'io') { const s = Math.min(14, w * 0.18); return poly([[x0 + s, y0], [x0 + w, y0], [x0 + w - s, y0 + h], [x0, y0 + h]]); }
  return `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="5" ${a}/>`;
}

// The ground sign: three bars getting shorter away from the wire. dir is 1 to hang down, -1 to stand up.
function groundSign(x, y, dir, stroke, sw) {
  const bar = (dy, half) => `M${x - half} ${y + dir * dy} H${x + half}`;
  return `<path d="${bar(0, 11)} ${bar(5, 7)} ${bar(10, 3)}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round"/>`;
}

// An EE part is drawn on the wire itself: leads from both edges of its slot to a symbol in the middle, so the
// wires meet it at the left and right middle like every other block and the layout needs no special case.
function eeSymbolSVG(kind, x0, y, w, stroke, sw, through) {
  const cx = x0 + w / 2, x1 = x0 + w;
  const a = `fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;
  const leads = half => `<path d="M${x0} ${y} H${cx - half} M${cx + half} ${y} H${x1}" ${a}/>`;
  if (kind === 'R') { // zigzag, six strokes
    let d = `M${cx - 18} ${y}`;
    for (let k = 0; k < 6; k++) d += ` L${cx - 18 + 6 * k + 3} ${y + (k % 2 ? 8 : -8)}`;
    return leads(18) + `<path d="${d} L${cx + 18} ${y}" ${a}/>`;
  }
  if (kind === 'C') return leads(4) + `<path d="M${cx - 4} ${y - 12} V${y + 12} M${cx + 4} ${y - 12} V${y + 12}" ${a}/>`;
  if (kind === 'L') { // four humps
    let d = `M${cx - 20} ${y}`;
    for (let k = 0; k < 4; k++) d += ' a5 5 0 0 1 10 0';
    return leads(20) + `<path d="${d}" ${a}/>`;
  }
  // Sources: an independent one is a circle, a dependent one a diamond (the usual schematic convention). A voltage
  // source carries − and +; a current source an arrow along the path, left to right.
  if (kind === 'VS' || kind === 'IS' || kind === 'DVS' || kind === 'DIS') {
    const body = kind[0] === 'D'
      ? `<polygon points="${cx - 15},${y} ${cx},${y - 15} ${cx + 15},${y} ${cx},${y + 15}" fill="#fff" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`
      : `<circle cx="${cx}" cy="${y}" r="14" fill="#fff" stroke="${stroke}" stroke-width="${sw}"/>`;
    // − on the left, + on the right: negative to positive along the path (REV mirrors it in renderSVG)
    const mark = kind.endsWith('VS')
      ? `<path d="M${cx - 10} ${y} h7 M${cx + 3} ${y} h7 M${cx + 6.5} ${y - 3.5} v7" ${a} stroke-width="1.6"/>`
      : `<path d="M${cx - 8} ${y} H${cx + 6} M${cx + 2} ${y - 4} L${cx + 7} ${y} L${cx + 2} ${y + 4}" ${a} stroke-width="1.8"/>`;
    return leads(kind[0] === 'D' ? 15 : 14) + body + mark;
  }
  // AC sources: a circle with a sine wave inside (the usual AC sign). The voltage source keeps a small − and + below
  // the wave and the current source its arrow, since both have a direction like their DC twins.
  if (kind === 'VAC' || kind === 'IAC') {
    const wave = (wy, half) => `<path d="M${cx - half} ${wy} q${half / 2} ${-half * 0.9} ${half} 0 t${half} 0" ${a} stroke-width="1.6"/>`;
    const mark = kind === 'VAC'
      ? wave(y - 4, 7) + `<path d="M${cx - 10} ${y + 6} h5 M${cx + 5} ${y + 6} h5 M${cx + 7.5} ${y + 3.5} v5" ${a} stroke-width="1.4"/>`
      : wave(y - 6, 5) + `<path d="M${cx - 8} ${y + 4} H${cx + 6} M${cx + 2} ${y} L${cx + 7} ${y + 4} L${cx + 2} ${y + 8}" ${a} stroke-width="1.6"/>`;
    return leads(14) + `<circle cx="${cx}" cy="${y}" r="14" fill="#fff" stroke="${stroke}" stroke-width="${sw}"/>` + mark;
  }
  // GND: a ground sign hangs from the middle; the wire runs on to the right only when something follows (through)
  if (kind === 'GND') return `<path d="M${x0} ${y} H${through ? x1 : cx} M${cx} ${y} V${y + 10}" ${a}/>` + groundSign(cx, y + 10, 1, stroke, sw);
  // D: anode on the left, the bar (cathode) on the right
  return leads(10) + `<polygon points="${cx - 10},${y - 10} ${cx - 10},${y + 10} ${cx + 10},${y}" fill="${stroke}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>` +
    `<path d="M${cx + 10} ${y - 10} V${y + 10}" ${a}/>`;
}

// The MEAS marker, above the part's name. Its direction follows the current: left to right along the path, or
// right to left on a reversed part. V is drawn + ... − with + where the current enters (the passive sign convention);
// I is an arrow the way the current flows. The text is the quantity until a solver gives n.measValue (Josue, 11/24:
// "marker now, number later"), then it is the reading, for example +5 V−.
function measSVG(n, x0, ink, td) {
  if (td) return measSVGDown(n, ink);
  const y = n.y - 42, dir = n.rev ? -1 : 1, x1 = x0 + n.w;
  const t = (s, x, size) => `<text x="${x}" y="${y + 4}" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="${size || 12}" fill="${ink}">${esc(s)}</text>`;
  const shown = n.measValue || n.meas;
  if (n.meas === 'V') {
    const [l, r] = dir > 0 ? ['+', '−'] : ['−', '+'];
    return `<g class="meas">${t(l, x0 + 7, 14)}${t(shown, n.x)}${t(r, x1 - 7, 14)}</g>`;
  }
  // I: the reading sits above a short arrow pointing the way the current flows (Josue, 11/25), both centered over
  // the part, so a long reading is just wider than the arrow and never runs into it
  const half = 11, ay = y + 2, tip = n.x + dir * half, tail = n.x - dir * half;
  return `<g class="meas"><path d="M${tail} ${ay} H${tip} M${tip - dir * 4} ${ay - 3.5} L${tip} ${ay} L${tip - dir * 4} ${ay + 3.5}" fill="none" stroke="${ink}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<text x="${n.x}" y="${y - 5}" text-anchor="middle" font-family="system-ui, Segoe UI, sans-serif" font-size="12" fill="${ink}">${esc(shown)}</text></g>`;
}

// The marker in the top-down view: on the left of the part, which runs down the page. V is + and − at its two ends
// (+ where the current enters: the top, or the bottom on a reversed part) with the reading between them; I is a short
// arrow the way the current flows, with the reading to its left.
function measSVGDown(n, ink) {
  const dir = n.rev ? -1 : 1, x = n.x - 18, y0 = n.y - n.w / 2, y1 = n.y + n.w / 2;
  const t = (str, tx, ty, size, anchor) => `<text x="${tx}" y="${ty}" text-anchor="${anchor || 'middle'}" font-family="system-ui, Segoe UI, sans-serif" font-size="${size || 12}" fill="${ink}">${esc(str)}</text>`;
  const shown = n.measValue || n.meas;
  if (n.meas === 'V') {
    const [hi, lo] = dir > 0 ? ['+', '−'] : ['−', '+'];
    return `<g class="meas">${t(hi, x, y0 + 14, 14)}${t(shown, x - 8, n.y + 4, 12, 'end')}${t(lo, x, y1 - 4, 14)}</g>`;
  }
  // the reading sits above the arrow here too; it ends just past the arrow so it stays clear of the wire
  const mid = n.y + 4, tip = mid + dir * 9, tail = mid - dir * 9;
  return `<g class="meas"><path d="M${x} ${tail} V${tip} M${x - 3.5} ${tip - dir * 4} L${x} ${tip} L${x + 3.5} ${tip - dir * 4}" fill="none" stroke="${ink}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>${t(shown, x + 6, n.y - 8, 12, 'end')}</g>`;
}

// hl is the lane to strength map from highlightAt; omit it for a clean drawing (downloads).
// interactive adds the click targets used on screen; downloads leave them out.
function renderSVG(model, hl, interactive) {
  layout(model);
  const { nodes, edges, width, height, title } = model;
  const rank = s => s === 'strong' ? 2 : s === 'weak' ? 1 : 0;
  const hlOf = n => (hl && n.type === 'el') ? hl.get(n.lane) : undefined;
  const o = [];
  o.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`);
  o.push(`<rect width="100%" height="100%" fill="#fff"/>`);
  o.push(`<text x="16" y="28" font-family="system-ui, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#444">${esc(title)}</text>`);
  // wires are planned in flow coordinates (p along, q across) and mapped to the page, so one plan serves both
  // directions
  const td = model.td, pt = ([p, q]) => td ? `${q} ${p}` : `${p} ${q}`;
  const line = pts => 'M' + pts.map(pt).join(' L');
  // wires: a highlighted branch also colors the wires that enter and leave it
  for (const [a, b] of edges) {
    const u = nodes[a], v = nodes[b];
    let d;
    if (u.lane === v.lane) d = line([[u.p + u.ext, u.q], [v.p - v.ext, v.q]]);
    else if (v.type === 'junction') d = line([[u.p + u.ext, u.q], [v.p, u.q], [v.p, v.q]]);
    else d = line([[u.p, u.q], [u.p, v.q], [v.p - v.ext, v.q]]);
    const su = hlOf(u), sv = hlOf(v);
    const s = rank(su) >= rank(sv) ? su : sv;
    const st = s ? HL[s] : null;
    o.push(`<path d="${d}" fill="none" stroke="${st ? st.stroke : INK}" stroke-width="${st ? st.w : 2}" stroke-linejoin="round"/>`);
    // yes on the wire that carries on from a decision, no on the branch that leaves it
    if (u.decision) o.push(u.lane === v.lane ? (td ? smallText('yes', u.x + 6, u.y + 16) : smallText('yes', u.x + 7, u.y - 6))
      : (td ? smallText('no', u.x + 12, u.y - 5) : smallText('no', u.x + 6, u.y + 18)));
  }
  // An end of the path that the single GND ties to ground gets its own small ground sign, so the connection is
  // visible and not only implied. The sign faces down in both views; in top-down it hangs off a stub to the right so
  // it does not sit on the wire.
  for (const side of model.tied || []) {
    const a = nodes[model.mainStart], b = nodes[model.mainEnd];
    const [p, q] = side === 'start' ? [a.p - a.ext, a.q] : [b.type === 'junction' ? b.p : b.p + b.ext, b.q];
    // the start's sign goes left of the wire, since the first part sits right against that end
    const x = td ? q : p, y = td ? p : q, gx = td ? x + (side === 'start' ? -14 : 12) : x;
    o.push(`<path d="M${x} ${y}${td ? ` H${gx}` : ''} V${y + 10}" fill="none" stroke="${INK}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" class="tie"/>` + groundSign(gx, y + 10, 1, INK, 2));
  }
  const h = CFG.H, hasOut = new Set(edges.map(([a]) => a));
  for (const n of nodes) {
    if (n.type === 'junction') { o.push(`<circle cx="${n.x}" cy="${n.y}" r="3.5" fill="${INK}"/>`); continue; }
    const st = hlOf(n) ? HL[hlOf(n)] : null;
    const col = n.color ? COLORS[n.color] : null;
    // A refused end wins over the branch highlight, and the highlight over a written color: the error is what
    // needs fixing first, and the highlight is only on while typing.
    const stroke = n.badEnd ? BAD : st ? st.stroke : col ? col.stroke : INK, sw = n.badEnd ? 3 : st ? st.w : 2;
    const ink = col && !st && !n.badEnd ? col.stroke : INK;
    const x0 = n.x - n.w / 2, y0 = n.y - h / 2;
    // A written shape wins over the start/end look; wires meet every shape at its left and right middle.
    const kind = n.shape ? (DRAW_AS[n.shape] || n.shape) : (n.role === 'start' ? 'pill' : n.role === 'end' ? 'flag' : 'rect');
    const fill = st ? st.fill : col ? col.fill : (kind === 'pill' || kind === 'flag' ? START_FILL : '#fff');
    if (interactive) o.push(`<g class="blk" data-ln="${n.ln}" data-idx="${n.idx}" style="cursor:pointer"><title>Click to change ${EE[n.shape] ? 'part' : 'shape'}</title>`);
    if (EE[n.shape]) {
      // the part's slot: as wide as the part along the path, as tall as a block across it (turned in top-down)
      const bw = td ? h : n.w, bh = td ? n.w : h, bx = n.x - bw / 2, by = n.y - bh / 2;
      // A part has no body to fill, so a highlight shows as a soft patch behind it; a color tints the lines only.
      if (st) o.push(`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="6" fill="${st.fill}"/>`);
      // an invisible slot so a click anywhere on the part counts, not only on its thin lines
      else if (interactive) o.push(`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="#fff" fill-opacity="0"/>`);
      // REV mirrors the symbol about its own center, which swaps + and −, turns the arrow and the diode around,
      // and leaves the leads where the wires meet them. Top-down then turns it a quarter clockwise, so what ran
      // left to right runs top to bottom.
      // The ground sign always faces down (Josue, 11/25), so in top-down it is not turned with the other parts: the
      // wire runs down the page and the bars sit under the point. When the path carries on, the sign hangs off a
      // short stub to the right instead of sitting on the wire.
      if (td && n.shape === 'GND') {
        const top = n.y - n.w / 2, bot = n.y + n.w / 2, thru = hasOut.has(n.id), gx = thru ? n.x + 12 : n.x;
        const ga = `fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"`;
        o.push(`<path d="M${n.x} ${top} V${thru ? bot : n.y + 10}${thru ? ` M${n.x} ${n.y} H${gx} V${n.y + 10}` : ''}" ${ga}/>` + groundSign(gx, n.y + 10, 1, stroke, sw));
      } else {
        const sym = eeSymbolSVG(n.shape, x0, n.y, n.w, stroke, sw, hasOut.has(n.id));
        const flat = n.rev ? `<g transform="matrix(-1 0 0 1 ${2 * n.x} 0)" class="rev">${sym}</g>` : sym;
        o.push(td ? `<g transform="rotate(90 ${n.x} ${n.y})">${flat}</g>` : flat);
      }
      const beside = t => t.replace('text-anchor="middle"', 'text-anchor="start"');
      if (td) {

    if (interactive) o.push('</g>');
  }
  o.push('</svg>');
  return o.join('\n');
}

// Node-side check: edges by label so a person can compare them to the sketch without reading ids.
function edgeList(model) {
  const nm = n => n.type === 'junction' ? 'J' + n.id : n.label;
  return model.edges.map(([a, b]) => nm(model.nodes[a]) + ' -> ' + nm(model.nodes[b]));
}

// What the hotkey types after the text `before` on its line: the closing backslash inside an open element list,
// nothing special inside an open [ ] value (so "don't" can be typed there), the opening asterisk otherwise.
function hotkeyText(before) {
  if (/^\s*\*[^\\]*$/.test(before)) return '\\';
  let depth = 0;
  if (before.includes('\\')) for (const ch of before.slice(before.indexOf('\\') + 1)) {
    if (ch === '[') depth++; else if (ch === ']' && depth > 0) depth--;

  return depth > 0 ? HOTKEY : '*';
}
