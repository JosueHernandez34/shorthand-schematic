<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorthand to Schematic V7</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --ink:#1b2430; --muted:#66707d; --line:#d9dee5; --accent:#2457c5; --err:#b3261e; --warn:#8a5a00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; margin-right:auto; }
  button { font:inherit; font-size:13px; padding:6px 12px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; color:var(--ink); }
  button:hover { border-color:var(--accent); color:var(--accent); }
  /* --leftw is the script panel width; dragging the divider sets it in pixels. The middle column is the divider. */
  main { flex:1; display:grid; grid-template-columns: var(--leftw, max(140px, 19%)) 12px 1fr; min-height:0; }
  #divider { position:relative; background:var(--line); cursor:col-resize; touch-action:none; user-select:none; }
  #divider:hover, #divider.drag { background:var(--accent); }
  #togglePanel { position:absolute; top:8px; left:0; width:12px; height:34px; padding:0; border:0; border-radius:0 6px 6px 0; background:var(--panel); color:var(--ink); font-size:14px; line-height:34px; cursor:pointer; box-shadow:0 0 0 1px var(--line); }
  #togglePanel:hover { color:var(--accent); }
  #rightPanel { user-select:none; cursor:grab; } #rightPanel.panning { cursor:grabbing; } #rightPanel .blk { cursor:pointer; }
  /* Collapsed: the column shrinks to nothing and the left panel is hidden (not removed) so its text and undo history stay. */
  main.collapsed { grid-template-columns: 0 12px 1fr; }
  main.collapsed .left { visibility:hidden; overflow:hidden; }
  main.collapsed #divider { cursor:default; }
  .left { display:flex; flex-direction:column; background:var(--panel); min-height:0; min-width:0; overflow:hidden; }
  /* Backdrop and textarea must share every font metric, or the highlighted lines drift off the text. */
  .ed { position:relative; flex:1; min-height:0; background:#fff; }
  #bd, #src { position:absolute; inset:0; margin:0; padding:14px; border:0; font:14px/21px ui-monospace, Consolas, Menlo, monospace; white-space:pre; tab-size:3; }
  #bd { overflow:hidden; pointer-events:none; color:transparent; }
  #bdIn { width:max-content; min-width:100%; }
  #bd .bl { margin:0 -14px; padding:0 14px; min-height:21px; }
  /* Bubble uses box-shadow instead of padding so the backdrop text keeps the textarea's exact character widths. */
  #bd .wb { background:rgba(229,56,59,.4); border-radius:8px; box-shadow:0 0 0 2px rgba(229,56,59,.4); }
  #bd .bl.strong { background:rgba(217,72,15,.24); }
  #bd .bl.weak { background:rgba(229,154,58,.20); }
  #src { width:100%; height:100%; resize:none; outline:none; background:transparent; color:var(--ink); overflow:auto; }
  #msgs { border-top:1px solid var(--line); padding:8px 14px; font-size:13px; max-height:130px; overflow:auto; }
  #msgs:empty { display:none; }
  .err { color:var(--err); } .warn { color:var(--warn); }
  code { background:#eef1f5; padding:1px 4px; border-radius:3px; font-size:12px; color:var(--ink); }
  /* The canvas: plain white from edge to edge, no card, no scroll bars. The drawing is positioned by a transform. */
  .right { position:relative; overflow:hidden; background:#fff; min-height:0; min-width:0; }
  #out { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
  #out svg { display:block; }
  #out .empty { width:min(640px, 80vw); }
  .empty { padding:40px; color:var(--muted); }
  .empty.err { color:var(--err); }
  #errs { flex:1 1 100%; font-size:12px; color:var(--err); }
  #errs:empty { display:none; }
  #zoomBar { position:absolute; top:12px; right:14px; z-index:2; display:flex; gap:6px; }
  #zoomBar button { min-width:36px; background:var(--panel); }
  #bar { display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; padding:8px 16px; background:var(--panel); border-top:1px solid var(--line); }
  #bar label { font-size:12px; color:var(--muted); }
  #cur { flex:1 1 260px; min-width:200px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); font:14px ui-monospace, Consolas, Menlo, monospace; }
  #cur:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  #waits { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--muted); }
  /* Same red as the bubble in the script, so a chip and its bubble read as one thing. */
  #waits .chip { color:var(--ink); background:rgba(229,56,59,.16); border:1px solid rgba(229,56,59,.55); border-radius:999px; padding:2px 10px; }
  #waits .chip.in { background:rgba(229,56,59,.4); font-weight:600; }
  /* The Settings page shares the Help dialog's frame so the two read as one family. */
  #setDlg { width:min(560px, 94vw); max-height:86vh; overflow:auto; padding:0; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); }
  #setDlg::backdrop { background:rgba(27,36,48,.45); }
  #setDlg .hh { position:sticky; top:0; display:flex; align-items:center; justify-content:space-between; padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
  #setDlg h2 { font-size:16px; margin:0; }
  .setBody { padding:6px 18px 16px; font-size:13px; }
  .setBody fieldset { border:1px solid var(--line); border-radius:8px; margin:12px 0 0; padding:8px 14px 12px; }
  .setBody legend { font-weight:600; padding:0 4px; }
  .setBody label { display:block; padding:4px 0; cursor:pointer; }
  .setBody .hint { margin:2px 0 6px; color:var(--muted); }
  #helpDlg { width:min(640px, 94vw); max-height:86vh; overflow:auto; padding:0; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); }
  #helpDlg::backdrop { background:rgba(27,36,48,.45); }
  #helpDlg .hh { position:sticky; top:0; display:flex; align-items:center; justify-content:space-between; padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
  #helpDlg h2 { font-size:16px; margin:0; }
  #helpBody { padding:6px 18px 16px; font-size:13px; }
  #helpBody h3 { font-size:13px; margin:16px 0 6px; }
  #helpBody table { border-collapse:collapse; width:100%; }
  #helpBody td { padding:5px 8px 5px 0; vertical-align:top; border-top:1px solid var(--line); }
  #helpBody th { text-align:left; font-weight:600; color:var(--muted); padding:0 8px 4px 0; }
  #helpBody td:first-child { white-space:nowrap; width:1%; }
  #helpBody svg { vertical-align:middle; }
  /* Narrow screens stack the panels: the divider becomes a strip (no dragging) that still holds the toggle. */
  @media (max-width:760px){
    main { grid-template-columns:1fr; grid-template-rows: 45% 12px 1fr; }
    main.collapsed { grid-template-columns:1fr; grid-template-rows: 0 12px 1fr; }
    #divider, main.collapsed #divider { cursor:default; }
    #togglePanel { top:0; left:auto; right:12px; width:34px; height:12px; line-height:10px; border-radius:0 0 6px 6px; }
  }
</style>
</head>
<body>
<header>
  <h1>Shorthand → Schematic <small style="font-weight:400;color:var(--muted)">V7</small></h1>
  <button id="ex">Load example</button>
  <button id="svg">Download SVG</button>
  <button id="png">Download PNG</button>
  <button id="settings" aria-haspopup="dialog">Settings</button>
  <button id="help" aria-haspopup="dialog">Help</button>
</header>
<!-- Settings (V6): one page where configurations collect; each fieldset is one setting, saved per browser. -->
<dialog id="setDlg" aria-labelledby="setTitle">
  <div class="hh"><h2 id="setTitle">Settings</h2><button id="setClose" aria-label="Close settings">Close</button></div>
  <form id="setForm" class="setBody" onsubmit="return false">
    <fieldset>
      <legend>Direction</legend>
      <p class="hint">Which way the diagram runs. The arrow button beside the zoom buttons switches it too.</p>
      <label><input type="radio" name="direction" value="lr"> Left to right (default)</label>
      <label><input type="radio" name="direction" value="td"> Top to bottom</label>
    </fieldset>
  </form>
</dialog>
<dialog id="helpDlg" aria-labelledby="helpTitle">
  <div class="hh"><h2 id="helpTitle">Legend</h2><button id="helpClose" aria-label="Close help">Close</button></div>
  <div id="helpBody"></div>
</dialog>
<main>
  <div class="left" id="leftPanel">
    <div class="ed"><div id="bd"><div id="bdIn"></div></div><textarea id="src" spellcheck="false"></textarea></div>
    <div id="msgs"></div>
  </div>
  <div id="divider" role="separator" aria-orientation="vertical" aria-label="Script panel border: drag or use the arrow keys to resize" tabindex="0">
    <button id="togglePanel" aria-expanded="true" aria-controls="leftPanel" aria-label="Hide script panel" title="Hide script panel">&lsaquo;</button>
  </div>
  <div class="right" id="rightPanel">
    <div id="zoomBar" role="group" aria-label="Zoom">
      <button id="dirBtn" aria-label="Draw top to bottom" title="Draw top to bottom">&darr;</button>
      <button id="zOut" aria-label="Zoom out">&minus;</button>
      <button id="zFit" aria-label="Fit the diagram to the width"><span id="zPct">100%</span></button>
      <button id="zIn" aria-label="Zoom in">+</button>
    </div>
    <div id="out"></div>
  </div>
</main>
<footer id="bar">
  <label for="cur">Current line</label>
  <input id="cur" type="text" spellcheck="false" autocomplete="off" placeholder="*A, B\ branch wait">
  <div id="waits" aria-live="polite"></div>
  <div id="errs" role="alert"></div>
</footer>

<script>
// ==CORE-START==
const EXAMPLE = `*Schematic\\
*S, A\\ SERIES
*A_1\\ BRANCH WAIT
*A_2, B_2\\ BRANCH RETURN^2
*B_1\\ RETURN
*B\\ SERIES
*C, D\\ SERIES
*E\\ END
*\\
`;

// The file always holds * and \ (the period is only a typing hotkey, see the editor code). One reading
// applies to every file: levels come from the commands, typed indentation and "meet" are ignored. The old
// v1 example gives the same picture under this reading, so no separate old-file parser is kept.
function parse(src, opts) {
  const errors = [], warnings = [];
  const lines = src.replace(/\t/g, '   ').split(/\r?\n/);
  return parseV2(lines, !!(opts && opts.partial), errors, warnings);
}

// Tolerates "return2" as well as "return^2" so the parser still works if the editor's
// auto-conversion was bypassed (paste, another editor).
// Shape words, flow blocks included: a word or a letter (tentative, like SHORT); "auto" keeps the default look
// (pill for the start, flag for the end, plain box otherwise). Flow blocks are shapes too, so a line can mix them
// with EE parts later: proc is a box, dec a diamond that shows its value, io a parallelogram. "d" moved from the
// plain diamond to dec (Josue, 11/24); a dec with no value looks exactly like the old diamond, so v4 scripts hold.
// EE parts (V5b) join the same table, so a line can mix flow blocks and circuit parts (no segregation, Josue 11/24).
// Their letters are uppercase and the shape letters lowercase; only single letters are case-sensitive (Josue, 11/24),
// so C is a capacitor and c a circle, D a diode and d a decision. Full words match in any case.
// V6: the rect shape word is gone (Josue, 11/24): a plain box is already the default, and RECT now names the
// rectangular form after MEAS. Old scripts still read; the word is passed over with a warning (see OLD_RECT).
const SHAPE_WORDS = { tri: 'tri', triangle: 'tri', t: 'tri',
  circ: 'circ', circle: 'circ', c: 'circ', dia: 'dia', diamond: 'dia', auto: 'auto',
  proc: 'proc', process: 'proc', p: 'proc', dec: 'dec', decision: 'dec', d: 'dec', io: 'io', i: 'io',
  R: 'R', resistor: 'R', C: 'C', capacitor: 'C', L: 'L', inductor: 'L', D: 'D', diode: 'D',
  // Sources are two- and three-letter codes (Josue, 11/24): VS replaced the single V, and the D in DVS and DIS
  // means dependent. Like every code longer than one letter they match in any case.
  vs: 'VS', vsource: 'VS', is: 'IS', isource: 'IS', dvs: 'DVS', dvsource: 'DVS', dis: 'DIS', disource: 'DIS',
  // AC sources (Josue, 11/24): VAC and IAC, written out as AC_VOLT_SRC and AC_CURR_SRC
  vac: 'VAC', iac: 'IAC',
  gnd: 'GND', ground: 'GND' };
// The written-out word for each part code (Josue, 11/24: R turns into RES, C into CAP, VS into VOLT_SRC), which is
// what the typing aid writes and what the legend shows. Each word is also accepted when typed.
const CODE_WORDS = { R: 'RES', C: 'CAP', L: 'IND', D: 'DIODE', VS: 'VOLT_SRC', IS: 'CURR_SRC', DVS: 'DEP_VOLT_SRC', DIS: 'DEP_CURR_SRC',
  VAC: 'AC_VOLT_SRC', IAC: 'AC_CURR_SRC', GND: 'GND' };
for (const [k, w] of Object.entries(CODE_WORDS)) SHAPE_WORDS[w.toLowerCase()] = k;
// MEAS (Josue, 11/24) names a quantity measured over a part: V the voltage across it, I the current through it.
// Single letters are exact like every letter, the words match in any case. MEAS alone measures the voltage.
const MEAS_QTY = { V: 'V', I: 'I', voltage: 'V', current: 'I' };
const measOf = w => w && MEAS_QTY[w.length === 1 ? w : w.toLowerCase()];
// How a MEAS marker writes an AC reading (Josue, 11/24): POLE, RECT or SINE after MEAS, in any case, for example
// MEAS V RECT. Each marker picks its own form, so there is no app-wide setting; polar is used when none is given.
const MEAS_FORM = { pole: 'polar', polar: 'polar', rect: 'rectangular', rectangular: 'rectangular', sine: 'sinusoidal', sinusoidal: 'sinusoidal' };
const formOf = w => w && MEAS_FORM[w.toLowerCase()];
// The old rectangle words (rect, rectangle, and the letter x exactly). They are accepted so v4 to V5b scripts still
// draw, since a box is what they meant anyway, but they warn because RECT now means something else.
const OLD_RECT = w => w === 'x' || ['rect', 'rectangle'].includes(w.toLowerCase());
// A source's own quantity is its value, so measuring it would only read the value back (Josue: "I would not ask
// to measure the voltage over a voltage source").
const OWN_QTY = { VS: 'V', DVS: 'V', IS: 'I', DIS: 'I', VAC: 'V', IAC: 'I' };
// A single letter is looked up exactly as typed; a word is looked up in lower case.
const shapeOf = w => SHAPE_WORDS[w.length === 1 ? w : w.toLowerCase()];
// EE parts: the unit their value is read in. A diode has none, so its value is shown as typed (Josue, 11/24).
// units lists what may be typed after the number; single letters exactly, words in any case.
const EE = {
  R: { unit: 'Ω', units: ['Ω', 'Ω', 'ohm', 'ohms'] }, // the Greek omega and the separate ohm sign look the same
  C: { unit: 'F', units: ['F', 'farad', 'farads'] },
  L: { unit: 'H', units: ['H', 'henry', 'henries', 'henrys'] },
  VS: { unit: 'V', units: ['V', 'volt', 'volts'] },
  IS: { unit: 'A', units: ['A', 'amp', 'amps', 'ampere', 'amperes'] },
  // A dependent source's value is usually an expression such as 2*Vx, which is not a number and so is shown as
  // typed; a plain number still gets its unit.
  DVS: { unit: 'V', units: ['V', 'volt', 'volts'] },
  DIS: { unit: 'A', units: ['A', 'amp', 'amps', 'ampere', 'amperes'] },
  D: { unit: '' },
  // AC sources: the value is a sinusoid, 5 cos(377t + 30) or [5, 377, 30] (see readAC); the unit is the amplitude's
  VAC: { unit: 'V', units: ['V', 'volt', 'volts'] },
  IAC: { unit: 'A', units: ['A', 'amp', 'amps', 'ampere', 'amperes'] },
  // V6: ground on purpose. A branch with no return is left open (Josue, 11/24), so GND is how a point is tied to
  // ground, for example a capacitor to ground: *C1, G1\ CAP = 10u, GND; BRANCH
  GND: { unit: '' },
};
// Settings the person picks on the Settings page (V6). The core reads them from here so node checks can set them too.
// V7: the ground return is gone (Josue, 11/25): ground is only where GND is written, so the only setting left is the
// direction. (The AC form lives on each MEAS marker: POLE, RECT or SINE.)
// direction: lr draws left to right, td top to bottom (Josue, 11/24: a top-down view toggle).
const SETTINGS = { direction: 'lr' };
// Parts with a direction (Josue, 11/24). Each is drawn negative to positive along the path, so current flows left to
// right: a voltage source has − on the left and + on the right, a current source's arrow points along the path, a
// diode's anode is on the left. The word REV in a part's entry (VS REV = 5) mirrors it to positive to negative.
const DIRECTIONAL = new Set(['VS', 'IS', 'DVS', 'DIS', 'VAC', 'IAC', 'D']);
// An AC source reads its amplitude like its DC twin, so 2m on AC_CURR_SRC is 2 mA.
const AC_TWIN = { VAC: 'VS', IAC: 'IS' };
// The name of an EE part is drawn small above its symbol. Josue's 11/24 note says a part with no value is drawn
// with "no label"; CC reads that as no value label and keeps the name so parts stay identifiable. False hides it.
const SHOW_EE_NAME = true;
// What each shape is drawn as; flow words reuse the plain shapes where they look the same.
const DRAW_AS = { proc: 'rect', dec: 'dia' };
// Wider than a box so the label still fits inside a triangle, circle, diamond or parallelogram.
const SHAPE_WIDTH = { tri: 1.3, circ: 1.15, dia: 1.45, dec: 1.45, io: 1.25 };

// SI prefixes (Josue, 11/24): m is milli and M mega because single letters are case-sensitive; u and µ are micro.
const PREFIX = { p: -12, n: -9, u: -6, 'µ': -6, 'μ': -6, m: -3, '': 0, k: 3, M: 6, G: 9 };
const PREFIX_OUT = { '-12': 'p', '-9': 'n', '-6': 'µ', '-3': 'm', '0': '', '3': 'k', '6': 'M', '9': 'G' };
// An EE value is a number, an optional prefix and an optional unit: 4.7k, 4.7kΩ, 4.7k ohm, 10u, 10 µF.
// The number may carry a power (4.7e3), which is why e stopped meaning end. The result is the value with real
// symbols (4.7 kΩ, 10 µF); a typed power is rewritten in engineering form. Anything else is shown as typed.
function eeValue(kind, value) {
  // a diode shows FWD_VOLT, and REV_VOLT when it breaks down: 0.7 V, or 0.7 V / 5.1 V
  if (kind === 'D' && value != null) {
    const d = readDiode(value);
    const volts = x => +x.toPrecision(3) + ' V'; // in volts, the way diode drops are quoted, not 700 mV
    return d ? volts(d.fwd) + (d.rev !== null ? ' / ' + volts(d.rev) : '') : value;
  }
  const ee = EE[kind];
  if (!ee || !ee.unit || value == null) return value;
  // an AC source shows its sinusoid tidied (5 cos(377t + 30°) V), keeping the cos or sin that was typed
  if (AC_TWIN[kind]) { const ac = readAC(kind, value); return ac ? fmtSinusoid(ac.amp, ac.w, ac.typedPh, ee.unit, ac.fn) : value; }
  const m = value.trim().match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))(?:e([+-]?\d+))?\s*([pnuµμmkMG]?)\s*(\S*)$/);
  if (!m) return value;
  const unitOk = u => !u || ee.units.some(x => x.length === 1 ? x === u : x === u.toLowerCase());
  let [, num, pow, pre, unit] = m;
  // a unit for another part (10 kH on a resistor) is a typo worth seeing, so the value stays as typed
  if (!unitOk(unit)) return value;
  if (pow !== undefined) {
    const x = parseFloat(num) * Math.pow(10, +pow + PREFIX[pre]);
    if (!isFinite(x)) return value;
    const e3 = x === 0 ? 0 : Math.max(-12, Math.min(9, Math.floor(Math.log10(Math.abs(x)) / 3) * 3));
    num = String(+(x / Math.pow(10, e3)).toPrecision(6)); pre = PREFIX_OUT[e3];
  } else pre = PREFIX_OUT[PREFIX[pre]];
  return num + ' ' + pre + ee.unit;
}
// The number a value stands for, for the solver (V6): 4.7k is 4700, 10u is 1e-5. Read with the same rules as
// eeValue so a value shows and solves alike; NaN when it is not a number in the part's unit.
function eeNumber(kind, value) {
  const ee = EE[kind];
  if (!ee || value == null) return NaN;
  const m = String(value).trim().match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))(?:e([+-]?\d+))?\s*([pnuµμmkMG]?)\s*(\S*)$/);
  if (!m) return NaN;
  const [, num, pow, pre, unit] = m;
  if (unit && !(ee.units || []).some(x => x.length === 1 ? x === unit : x === unit.toLowerCase())) return NaN;
  return parseFloat(num) * Math.pow(10, (pow ? +pow : 0) + PREFIX[pre]);
}
// A result in engineering form with three significant figures and its unit: 0.00106 A is 1.06 mA.
function fmtEng(x, unit) {
  if (!isFinite(x)) return '?';
  if (Math.abs(x) < 1e-15) return '0 ' + unit;
  let e3 = Math.max(-12, Math.min(9, Math.floor(Math.log10(Math.abs(x)) / 3) * 3));
  let m = +(x / Math.pow(10, e3)).toPrecision(3);
  // 0.99996 V rounds to 1000 mV; step up a prefix so it reads 1 V
  if (Math.abs(m) >= 1000 && e3 < 9) { e3 += 3; m = +(x / Math.pow(10, e3)).toPrecision(3); }
  return (m < 0 ? '−' : '') + Math.abs(m) + ' ' + PREFIX_OUT[e3] + unit;
}
// An AC result (a phasor re + j·im at angular frequency w, in rad/s) written in the form chosen on the Settings
// page. The phasor is the cosine reference: A ∠ φ is A cos(wt + φ).
function formatPhasor(re, im, unit, form, w) {
  const mag = Math.hypot(re, im), ang = Math.atan2(im, re) * 180 / Math.PI;
  if (form === 'rectangular') {
    const big = Math.max(Math.abs(re), Math.abs(im));
    const e3 = big < 1e-15 ? 0 : Math.max(-12, Math.min(9, Math.floor(Math.log10(big) / 3) * 3));
    const n = v => +(v / Math.pow(10, e3)).toPrecision(3);
    return `${n(re)} ${im < 0 ? '−' : '+'} j${Math.abs(n(im))} ${PREFIX_OUT[e3]}${unit}`;
  }
  // Josue's own way of writing a source (11/24): amplitude, omega and angle, so the result reads the same way
  if (form === 'sinusoidal') return fmtSinusoid(mag, w, ang, unit, 'cos');
  return `${fmtEng(mag, unit)} ∠ ${fmtDeg(ang)}`;
}
// a real minus sign, as fmtEng writes; || 0 turns −0 into 0
const fmtDeg = a => { const d = +a.toFixed(1) || 0; return (d < 0 ? '−' : '') + Math.abs(d) + '°'; };
// 5 cos(377t + 30°) V. The prefix goes with the unit at the end, as in 2 cos(1000t) mA; a zero angle is left out.
function fmtSinusoid(amp, w, ang, unit, fn) {
  const [a, u] = fmtEng(amp, unit).split(' ');
  const ph = Math.abs(ang) < 0.05 ? '' : ` ${ang < 0 ? '−' : '+'} ${fmtDeg(Math.abs(ang))}`;
  return `${a} ${fn || 'cos'}(${w == null ? 'ω' : +(+w).toPrecision(6)}t${ph}) ${u || ''}`.trim();
}
